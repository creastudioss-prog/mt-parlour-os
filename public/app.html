function openWipe(){
  dialog(`<div class="dlg__h"><h2>Empezar con datos reales</h2><button type="button" data-close aria-label="Cerrar">×</button></div>
    <p>Esto borra <b>todas</b> las citas, clientas, ventas, mensajes y demás datos de ejemplo. Los ajustes se quedan.</p><p class="small muted">Antes, si quieres, descarga un respaldo desde “Exportar”.</p>
    <div class="field"><label for="wp">Escribe BORRAR para confirmar</label><input class="inp" id="wp" autocomplete="off"></div>
    <button class="btn btn--pri btn--block" type="submit">Borrar todo</button>`,
    async()=>{if($('wp').value.trim().toUpperCase()!=='BORRAR'){toast('Escribe BORRAR para confirmar.');return false}
      let n=0;for(const c of COLS){if(c==='settings')continue;for(const d of [...D[c]]){await store.del(c,d.id);n++}}toast(`Listo: ${n} registros borrados`)});
}
function openPin(){const has=!!lsGet('mt-pin','');
  dialog(`<div class="dlg__h"><h2>${has?'Quitar PIN':'Poner PIN'}</h2><button type="button" data-close aria-label="Cerrar">×</button></div>
    <p class="small muted">El PIN protege el programa en este dispositivo: al abrirlo, lo pide antes de mostrar nada.</p>
    <div class="field"><label for="pin-v">${has?'PIN actual':'Nuevo PIN (4 a 6 números)'}</label><input class="inp" id="pin-v" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
    <button class="btn btn--pri btn--block" type="submit">${has?'Quitar':'Guardar PIN'}</button>`,
    async()=>{const v=$('pin-v').value.trim();if(!/^\d{4,6}$/.test(v)){toast('Usa de 4 a 6 números.');return false}const h=await hashPin(v);
      if(has){if(h!==lsGet('mt-pin','')){toast('PIN incorrecto.');return false}lsSet('mt-pin','');toast('PIN quitado')}else{lsSet('mt-pin',h);toast('PIN activado en este dispositivo')}render()});
}
function showLock(){const h=lsGet('mt-pin','');if(!h)return;const L=$('lock');
  L.innerHTML=`<form class="lock__p" id="lockf"><div class="brand" style="font-size:26px"><b>MT</b><span>AESTHETICS</span></div><p class="muted">Escribe tu PIN</p><input class="inp" id="lock-v" type="password" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="PIN"><p class="err" id="lock-e" hidden>PIN incorrecto</p><button class="btn btn--pri btn--block" type="submit">Entrar</button></form>`;
  L.hidden=false;$('lock-v').focus();
  $('lockf').onsubmit=async e=>{e.preventDefault();if(await hashPin($('lock-v').value.trim())===h){L.hidden=true;L.innerHTML=''}else{$('lock-e').hidden=false;$('lock-v').value=''}};
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
function applyTheme(){const t=lsGet('mt-theme','light');if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
applyTheme();
let MODE='os';
function setMode(m){MODE=m;$('os').hidden=m!=='os';$('tabbar').hidden=m!=='os';$('web').hidden=m!=='web';
  $('m-os').setAttribute('aria-pressed',m==='os');$('m-web').setAttribute('aria-pressed',m==='web');lsSet('mt-mode',m);
  if(m==='web')renderWeb();render();scrollTo({top:0})}
$('m-os').onclick=()=>{setMode('os');showLock()};$('m-web').onclick=()=>setMode('web');
let startMode=lsGet('mt-mode','os');if(location.hash==='#reservar')startMode='web';
setMode(startMode);if(startMode==='os')showLock();
(async()=>{
  await Promise.resolve();
  try{ db=window.claude?await window.claude.use('db'):null }catch(e){db=null}
  if(db) COLS.forEach(c=>db.collection(c).onSnapshot(s=>{D[c]=s.docs.map(d=>({id:d.id,...d.data()}));scheduleRender()},()=>{}));
  else { OS.offline=true; scheduleRender() }
  try{ sample=window.claude?await window.claude.use('sample'):null }catch(e){sample=null}
  try{ if(sample){const l=await sample.limits();canTools=!!l?.tools} }catch(e){canTools=false}
  try{ downloads=window.claude?await window.claude.use('downloads'):null }catch(e){downloads=null}
  scheduleRender();
})();
setInterval(()=>{if(MODE==='os'&&OS.mod!=='asistente')scheduleRender();else if(MODE==='web'&&C.step===2&&!C.wl)renderWeb()},60000);
</script>
