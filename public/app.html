<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F2D24"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MT Parlour"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>MT Parlour Reservas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: barra de marca con selector "Parlour OS / Página de reservas". Parlour OS = navegación lateral (escritorio) o inferior (móvil) + módulos; página de reservas = columna estrecha tipo móvil. */
:root{
  --cream:#F4EFE6; --oat:#EFE4D2; --paper:#FBF8F3;
  --euca:#1F2D24; --euca-2:#15211A; --copper:#A87C5C; --copper-ink:#8A6143;
  --ink:#1A1A1A; --muted:#5E625B; --line:rgba(26,26,26,.14); --line-2:rgba(26,26,26,.3);
  --ok:#3F6B4E; --ok-bg:#E3ECE3; --warn:#9A6A1E; --warn-bg:#F5E8CF; --bad:#9B3B2E; --bad-bg:#F3DCD6; --info-bg:#E7E1D6;
  --on-euca:#F4EFE6; --ig:#B5487A; --fb:#3B5DA8;
  --display:'Fraunces','Times New Roman',serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --cream:#141C17; --oat:#1D2821; --paper:#1F2A23;
  --euca:#D9CDB8; --euca-2:#EDE4D3; --copper:#C99D7B; --copper-ink:#D6AE8E;
  --ink:#EDE7DC; --muted:#A9AEA3; --line:rgba(237,231,220,.13); --line-2:rgba(237,231,220,.3);
  --ok:#9CC7A8; --ok-bg:#22362A; --warn:#E3B76A; --warn-bg:#3A2F1C; --bad:#E79A8B; --bad-bg:#3D231F; --info-bg:#2A332C;
  --on-euca:#141C17; --ig:#E78AB3; --fb:#8FA9E3; color-scheme:dark}}
:root[data-theme="dark"]{
  --cream:#141C17; --oat:#1D2821; --paper:#1F2A23;
  --euca:#D9CDB8; --euca-2:#EDE4D3; --copper:#C99D7B; --copper-ink:#D6AE8E;
  --ink:#EDE7DC; --muted:#A9AEA3; --line:rgba(237,231,220,.13); --line-2:rgba(237,231,220,.3);
  --ok:#9CC7A8; --ok-bg:#22362A; --warn:#E3B76A; --warn-bg:#3A2F1C; --bad:#E79A8B; --bad-bg:#3D231F; --info-bg:#2A332C;
  --on-euca:#141C17; --ig:#E78AB3; --fb:#8FA9E3; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,5.4vw,38px);line-height:1.08;letter-spacing:-.01em}
h2{font-size:21px;line-height:1.15}
h3{font-size:17px;line-height:1.2}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* Barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--cream) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar__in{padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:.45em;font-family:var(--display);font-size:18px;line-height:1}
.brand b{font-weight:500;letter-spacing:-.02em}
.brand span{font-weight:380;letter-spacing:.06em;font-size:.86em}
.brand small{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--copper-ink);margin-left:.5em;border:1px solid var(--copper);border-radius:4px;padding:2px 5px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--euca);color:var(--on-euca)}
.simbar{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.simbar i{font-style:normal;background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:1px 7px;font-weight:600;letter-spacing:.06em;font-size:10px;text-transform:uppercase}

/* Botones / formularios */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line-2);background:var(--paper);border-radius:10px;padding:9px 13px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn--pri{background:var(--euca);color:var(--on-euca);border-color:var(--euca)}
.btn--pri:hover{background:var(--euca-2);border-color:var(--euca-2)}
.btn--cu{background:var(--copper);border-color:var(--copper);color:#fff}
.btn--ghost{background:transparent}
.btn--sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn--danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn--block{width:100%;padding:13px}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.field label em{font-style:normal;text-transform:none;letter-spacing:0}
.inp{width:100%;min-width:0;border:1px solid var(--line-2);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:15px}
textarea.inp{resize:vertical;min-height:72px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.row3{grid-template-columns:1fr 1fr}}
.err{color:var(--bad);font-size:13px}
.empty{padding:16px;border:1px dashed var(--line-2);border-radius:12px;color:var(--muted);font-size:14px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-hold,.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-conf,.c-ok,.c-paid{background:var(--ok-bg);color:var(--ok)}
.c-done,.c-info{background:var(--info-bg);color:var(--copper-ink)}
.c-cancel,.c-noshow,.c-bad{background:var(--bad-bg);color:var(--bad)}
.tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap}
.tag--ig{color:var(--ig);border-color:currentColor}
.tag--fb{color:var(--fb);border-color:currentColor}

/* ============ APP SHELL ============ */
.os{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:calc(100vh - 60px)}
.nav{border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start;height:calc(100vh - 58px)}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:500}
.nav button:hover{color:var(--ink);background:var(--paper)}
.nav button[aria-current="page"]{background:var(--euca);color:var(--on-euca)}
.nav .badge{font-size:11px;font-weight:600;min-width:20px;text-align:center;border-radius:999px;padding:0 6px;background:var(--copper);color:#fff}
.nav__sep{height:1px;background:var(--line);margin:10px 8px}
.nav__foot{margin-top:auto;padding:10px 12px;font-size:12px;color:var(--muted)}
.main{padding-inline:clamp(16px,3vw,32px);padding-block:22px 90px;display:grid;gap:20px;align-content:start;min-width:0}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.mhead__a{display:flex;gap:8px;flex-wrap:wrap}
.tabbar{display:none}
@media (max-width:860px){
  .os{grid-template-columns:minmax(0,1fr)}
  .nav{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;position:relative}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--ink);font-weight:600}
  .tabbar .dot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--copper)}
}
.more{position:fixed;inset:0;z-index:40;background:rgba(10,14,11,.45);display:grid;align-items:end}
.more__p{background:var(--paper);border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:4px}
.more__p button{display:flex;justify-content:space-between;border:0;background:transparent;padding:13px 10px;border-radius:10px;font-size:15px;text-align:left}
.more__p button:hover{background:var(--oat)}

/* Paneles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi{background:var(--paper);padding:13px 15px;display:grid;gap:3px;text-align:left;border:0}
button.kpi:hover{background:var(--cream)}
.kpi b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi em.up{color:var(--ok)} .kpi em.down{color:var(--bad)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1040px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:20px;align-content:start;min-width:0}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--paper);display:grid;min-width:0}
.panel__h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel__b{padding:14px 16px;display:grid;gap:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--oat);color:var(--ink)}
.rows>div,.rows>button{padding:12px 16px;border-bottom:1px solid var(--line)}
.rows>:last-child{border-bottom:0}
.rowbtn{display:grid;width:100%;text-align:left;border:0;background:transparent;gap:3px}
.rowbtn:hover{background:var(--cream)}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.alert i{width:8px;height:8px;border-radius:50%;background:var(--copper)}
.alert i.bad{background:var(--bad)} .alert i.ok{background:var(--ok)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--cream)}
.r{text-align:right}

/* Agenda */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(56px,1fr);gap:6px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--line)}
.strip button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 0;display:grid;justify-items:center;font-size:11px;color:var(--muted)}
.strip button b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink)}
.strip button i{font-style:normal;font-size:10px;min-height:14px}
.strip button i.has{color:var(--copper-ink);font-weight:600}
.strip button[aria-pressed="true"]{border-color:var(--ink);background:var(--cream)}
.appt{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.appt:last-child{border-bottom:0}
.appt__t{font-variant-numeric:tabular-nums;font-size:14px}
.appt__t small{display:block;color:var(--muted);font-size:12px}
.appt__m{display:grid;gap:6px;min-width:0}
.appt__top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.appt__n{font-family:var(--display);font-size:17px;border:0;background:none;padding:0;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.appt__s{font-size:13px;color:var(--muted)}
.note{font-size:13px;background:var(--oat);border-radius:8px;padding:7px 10px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.blockrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 8px,var(--line) 8px 9px)}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.linkbox code{flex:1;min-width:0;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}

/* Barras */
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:120px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.barrow .tr{height:10px;background:var(--oat);border-radius:5px;overflow:hidden}
.barrow .tr span{display:block;height:100%;background:var(--euca);border-radius:5px}
.barrow .tr span.low{background:var(--bad)}
.barrow .tr span.cu{background:var(--copper)}
.week{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;align-items:end;height:150px;padding-top:10px}
.week div{display:grid;gap:4px;align-content:end;justify-items:center;height:100%;font-size:11px;color:var(--muted)}
.week div span{width:100%;max-width:34px;background:var(--euca);border-radius:4px 4px 0 0;min-height:2px}
.week div.cur span{background:var(--copper)}
.week div b{font-weight:500;color:var(--ink);font-size:11px}

/* Redes */
.post{display:grid;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:0}
.post__h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.post__t{font-size:15px}
.post__ctx{font-size:12px;color:var(--muted)}

/* Chat */
.chat{display:grid;grid-template-rows:minmax(0,1fr) auto;height:min(72vh,720px);min-height:420px}
.chat__log{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:14px;white-space:pre-wrap;line-height:1.5}
.msg--u{align-self:flex-end;background:var(--euca);color:var(--on-euca);border-bottom-right-radius:4px}
.msg--a{align-self:flex-start;background:var(--oat);border-bottom-left-radius:4px}
.msg--a.think{color:var(--muted);font-style:italic}
.chat__in{border-top:1px solid var(--line);padding:12px;display:grid;gap:10px}
.chat__form{display:flex;gap:8px}
.chat__form .inp{flex:1}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sugs button{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:5px 11px;font-size:12px}
.sugs button:hover{border-color:var(--copper)}

/* ============ PÁGINA DE RESERVAS (clienta) ============ */
.client{max-width:540px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:22px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--copper)}
.stephead{display:grid;gap:8px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats button{flex:none;border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.svc-list{display:grid;border-top:1px solid var(--line)}
.svc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 4px}
.svc:hover{background:var(--paper)}
.svc__n{font-family:var(--display);font-size:18px}
.svc__m{font-size:13px;color:var(--muted)}
.svc__p{font-size:14px;align-self:center;text-align:right}
.svc__p small{display:block;color:var(--muted);font-size:11px}
.svc--consult{background:var(--oat);border-radius:12px;border:0}
.picked{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.days{display:grid;grid-auto-flow:column;grid-auto-columns:64px;gap:6px;overflow-x:auto;padding-bottom:6px}
.day{display:grid;justify-items:center;gap:2px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 0}
.day small{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.day b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}
.day em{font-style:normal;font-size:10px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--euca);color:var(--on-euca);border-color:var(--euca)}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] em{color:inherit;opacity:.8}
.day[disabled]{opacity:.4;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.slot{border:1px solid var(--line-2);background:transparent;border-radius:10px;padding:10px 0;font-variant-numeric:tabular-nums;font-size:14px}
.slot:hover{border-color:var(--copper)}
.slot[aria-pressed="true"]{background:var(--copper);border-color:var(--copper);color:#fff}
.form{display:grid;gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;background:var(--paper)}
.chk input{accent-color:var(--copper)}
.field .chk{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);font-weight:400}
.summary{border:1px solid var(--line);border-radius:14px;background:var(--paper);display:grid;margin:0}
.summary div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.summary div:last-child{border-bottom:0}
.summary dt{color:var(--muted)} .summary dd{margin:0;text-align:right}
.policy{font-size:13px;color:var(--muted);line-height:1.55}
.done{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:10px}
.seal{width:72px;height:72px;border-radius:50%;border:1px solid var(--copper);display:grid;place-items:center;font-family:var(--display);font-size:30px;color:var(--copper-ink)}
.back{justify-self:start;border:0;background:transparent;color:var(--muted);font-size:13px;padding:0}

/* ============ PAGO SIMULADO ============ */
.sheet{position:fixed;inset:0;z-index:60;display:grid;place-items:end center;background:rgba(10,14,11,.5)}
@media (min-width:640px){.sheet{place-items:center}}
.sheet__p{width:min(440px,100%);background:#fff;color:#1a1f36;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;max-height:92vh;overflow:auto}
.sheet__p>*{min-width:0}
@media (min-width:640px){.sheet__p{border-radius:16px}}
.sheet__top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#697386}
.sheet__top b{color:#635bff;font-weight:700;font-size:15px}
.sheet__amt{font-size:30px;font-weight:600;letter-spacing:-.02em}
.sheet__desc{font-size:13px;color:#697386}
.pay-apple{background:#000;color:#fff;border:0;border-radius:8px;padding:13px;font-weight:600;font-size:15px}
.pay-google{background:#fff;color:#3c4043;border:1px solid #dadce0;border-radius:8px;padding:12px;font-weight:600;font-size:15px}
.or{display:flex;align-items:center;gap:10px;color:#8792a2;font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:#e3e8ee}
.card{border:1px solid #e3e8ee;border-radius:8px;display:grid}
.card input{width:100%;min-width:0;border:0;border-bottom:1px solid #e3e8ee;padding:11px 12px;font-size:15px;color:#1a1f36;background:#fff}
.card .r2{display:grid;grid-template-columns:1fr 1fr}
.card .r2 input:first-child{border-right:1px solid #e3e8ee}
.card .r2 input{border-bottom:0}
.pay-card{background:#635bff;color:#fff;border:0;border-radius:8px;padding:13px;font-weight:600;font-size:15px}
.sheet__foot{font-size:11px;color:#8792a2;text-align:center}
.sheet__x{border:0;background:transparent;font-size:22px;line-height:1;color:#697386}
.spin{width:28px;height:28px;border:3px solid #e3e8ee;border-top-color:#635bff;border-radius:50%;animation:sp .8s linear infinite;justify-self:center}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.hold{font-size:12px;color:#9a6a1e;background:#fbf1de;border-radius:6px;padding:6px 10px}

/* Diálogos y toast */
.dlg{position:fixed;inset:0;z-index:50;background:rgba(10,14,11,.45);display:grid;place-items:center;padding:16px}
.dlg__p{width:min(520px,100%);background:var(--paper);border-radius:16px;padding:20px;display:grid;gap:14px;max-height:90vh;overflow:auto}
.dlg__p.wide{width:min(720px,100%)}
.dlg__h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg__h button{border:0;background:transparent;font-size:24px;color:var(--muted);line-height:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:10px;font-size:14px;z-index:70;max-width:calc(100% - 32px)}
.timeline{display:grid;gap:0;border-left:1px solid var(--line-2);margin-left:6px}
.timeline div{padding:0 0 12px 16px;position:relative;font-size:13px}
.timeline div::before{content:"";position:absolute;left:-4px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--copper)}
.timeline time{display:block;color:var(--muted);font-size:12px}

/* ===== v3: añadidos ===== */
.sig{display:grid;gap:6px}
.sig canvas{width:100%;height:150px;background:#fff;border:1px dashed var(--line-2);border-radius:10px;touch-action:none;cursor:crosshair}
.sig__row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.sig__row button{border:0;background:none;color:var(--copper-ink);text-decoration:underline;font-size:12px}
.consent{max-height:190px;overflow:auto;font-size:13px;line-height:1.55;background:var(--oat);border-radius:10px;padding:12px 14px;white-space:pre-wrap}
.warnbox{border:1px solid var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}
.badbox{border:1px solid var(--bad);background:var(--bad-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}
.okbox{border:1px solid var(--ok);background:var(--ok-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photos figure{margin:0;display:grid;gap:3px;font-size:11px;color:var(--muted)}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--oat)}
.prog{height:10px;background:var(--oat);border-radius:5px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--copper);border-radius:5px}
.prog span.ok{background:var(--ok)}
.lock{position:fixed;inset:0;z-index:90;background:var(--cream);display:grid;place-items:center;padding:16px}
.lock__p{display:grid;gap:14px;justify-items:center;text-align:center;width:min(320px,100%)}
.lock input{font-size:28px;letter-spacing:.5em;text-align:center;width:100%}
.action{border:1px solid var(--copper);border-radius:12px;background:var(--paper);padding:12px 14px;display:grid;gap:8px;align-self:stretch;max-width:520px}
.action b{font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.cardlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:14px 16px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;background:var(--cream)}
.pcard h3{font-size:16px}
.stars{display:flex;gap:4px}
.stars button{border:1px solid var(--line-2);background:transparent;border-radius:8px;width:40px;height:40px;font-size:18px}
.stars button[aria-pressed="true"]{background:var(--copper);color:#fff;border-color:var(--copper)}
.tiprow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tiprow button{border:1px solid #e3e8ee;background:#fff;border-radius:8px;padding:9px 0;font-weight:600;color:#1a1f36}
.tiprow button[aria-pressed="true"]{border-color:#635bff;color:#635bff;background:#f5f4ff}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.ln.tot{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:14px 16px}
.cal__d{border:1px solid var(--line);border-radius:10px;min-height:110px;padding:6px;display:grid;align-content:start;gap:4px;background:var(--cream);min-width:0}
.cal__d b{font-size:11px;color:var(--muted);font-weight:500}
.cal__d.today{border-color:var(--copper)}
.post-chip{font-size:11px;border-radius:6px;padding:3px 6px;background:var(--paper);border:1px solid var(--line);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.post-chip.st-publicada{opacity:.55;text-decoration:line-through}
.post-chip.st-lista{border-color:var(--ok)}
@media (max-width:760px){.cal{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chanrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px}
.chanrow:last-child{border-bottom:0}
.src-tag{font-size:11px;color:var(--copper-ink);border:1px solid var(--copper);border-radius:4px;padding:0 6px}
.mini{font-size:12px;color:var(--muted)}

/* ===== v5: colores de marca, navegación, calendario ===== */
:root{--nav-bg:#1F2D24;--nav-fg:#F4EFE6;--nav-mut:rgba(244,239,230,.62);--nav-hi:rgba(244,239,230,.10);
  --cta:#8F6446;--cta-2:#7A543A;--on-cta:#FFFFFF;--cta-soft:#F1E3D6;--hero:#1F2D24;--on-hero:#F4EFE6;--hero-mut:rgba(244,239,230,.72);
  --c-fac:#A87C5C;--c-mas:#3F6B4E;--c-wax:#B0627A;--c-hifu:#6B5A86;--c-con:#7D7A5C;--c-blk:#9A9A92;
  --cal-free:#F1E3D6;--cal-free-ink:#7A543A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nav-bg:#0E1511;--nav-fg:#EDE7DC;--nav-mut:rgba(237,231,220,.6);--nav-hi:rgba(237,231,220,.08);
  --cta:#C99D7B;--cta-2:#D9B08F;--on-cta:#141C17;--cta-soft:#3A2D23;--hero:#0E1511;--on-hero:#EDE7DC;--hero-mut:rgba(237,231,220,.7);
  --c-fac:#D3A47F;--c-mas:#86BC97;--c-wax:#E59AB0;--c-hifu:#B6A3D6;--c-con:#C4C09A;--c-blk:#6F716B;--cal-free:#3A2D23;--cal-free-ink:#E2BC9C}}
:root[data-theme="dark"]{--nav-bg:#0E1511;--nav-fg:#EDE7DC;--nav-mut:rgba(237,231,220,.6);--nav-hi:rgba(237,231,220,.08);
  --cta:#C99D7B;--cta-2:#D9B08F;--on-cta:#141C17;--cta-soft:#3A2D23;--hero:#0E1511;--on-hero:#EDE7DC;--hero-mut:rgba(237,231,220,.7);
  --c-fac:#D3A47F;--c-mas:#86BC97;--c-wax:#E59AB0;--c-hifu:#B6A3D6;--c-con:#C4C09A;--c-blk:#6F716B;--cal-free:#3A2D23;--cal-free-ink:#E2BC9C}

/* Botones: cobre = acción principal; eucalipto = secundaria fuerte */
.btn{border-radius:12px;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn--pri{background:var(--cta);color:var(--on-cta);border-color:var(--cta)}
.btn--pri:hover{background:var(--cta-2);border-color:var(--cta-2)}
.btn--cu{background:var(--cta-soft);color:var(--cta-2);border-color:transparent}
.btn--dark{background:var(--nav-bg);color:var(--nav-fg);border-color:var(--nav-bg)}
.btn--dark:hover{opacity:.92}
.seg button[aria-pressed="true"]{background:var(--cta);color:var(--on-cta)}
.tabs button[aria-pressed="true"]{background:var(--cta-soft);color:var(--cta-2)}
.badge,.nav .badge{background:var(--cta)!important;color:var(--on-cta)!important}
.kpi b{color:var(--ink)}
.kpi:first-child b{color:var(--cta-2)}
.chk:has(input:checked){border-color:var(--cta);background:var(--cta-soft)}
.cats button[aria-pressed="true"]{background:var(--cta);border-color:var(--cta);color:var(--on-cta)}
.day[aria-pressed="true"]{background:var(--cta);border-color:var(--cta);color:var(--on-cta)}

/* Barra lateral en eucalipto con íconos y grupos */
@media (min-width:861px){.os{grid-template-columns:232px minmax(0,1fr)}}
.nav{background:var(--nav-bg);border-right:0;padding:16px 12px;gap:1px;overflow-y:auto}
.nav__grp{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--nav-mut);padding:14px 12px 6px}
.nav__grp:first-child{padding-top:4px}
.nav button{color:var(--nav-mut);justify-content:flex-start;gap:11px;padding:9px 12px;border-radius:10px}
.nav button svg{width:18px;height:18px;flex:none}
.nav button span.l{flex:1}
.nav button:hover{color:var(--nav-fg);background:var(--nav-hi)}
.nav button[aria-current="page"]{background:var(--cta);color:var(--on-cta)}
.nav button[aria-current="page"] .badge{background:var(--on-cta)!important;color:var(--cta)!important}
.nav__foot{color:var(--nav-mut);border-top:1px solid var(--nav-hi);padding-top:12px}
.nav__foot b{color:var(--nav-fg)}
.tabbar button[aria-current="page"]{color:var(--cta-2)}
.tabbar .dot{background:var(--cta)}

/* Inicio simple */
.hero{background:var(--hero);color:var(--on-hero);border-radius:20px;padding:clamp(20px,3vw,30px);display:grid;gap:18px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:center}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .eyebrow{color:var(--hero-mut)}
.hero h1{color:var(--on-hero)}
.hero p{color:var(--hero-mut)}
.hero__acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hero .btn--ghost{color:var(--on-hero);border-color:rgba(244,239,230,.35);background:transparent}
.next{background:color-mix(in srgb,var(--on-hero) 8%,transparent);border:1px solid color-mix(in srgb,var(--on-hero) 18%,transparent);border-radius:16px;padding:16px;display:grid;gap:8px}
.next__t{font-family:var(--display);font-size:30px;line-height:1}
.next__n{font-family:var(--display);font-size:20px}
.next .btn{border-color:transparent}
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:900px){.quick{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qa{display:grid;justify-items:center;gap:8px;padding:16px 8px;border-radius:16px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:500;text-align:center}
.qa:hover{border-color:var(--cta);background:var(--cta-soft)}
.qa svg{width:26px;height:26px;color:var(--cta-2)}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px}
.todo:last-child{border-bottom:0}
.todo__i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--cta-soft);color:var(--cta-2);font-weight:700}
.todo__i.bad{background:var(--bad-bg);color:var(--bad)}
.todo__i.ok{background:var(--ok-bg);color:var(--ok)}
details.more-d summary{cursor:pointer;padding:12px 16px;font-size:13px;color:var(--cta-2);font-weight:600;list-style:none}
details.more-d summary::-webkit-details-marker{display:none}
.help{display:flex;gap:10px;align-items:flex-start;background:var(--cta-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13px}
.help b{color:var(--cta-2)}

/* ===== Calendario de reservas (estilo Calendly) ===== */
.client.wide{max-width:1000px}
.bk{display:grid;grid-template-columns:260px minmax(0,1fr) 220px;border:1px solid var(--line);border-radius:20px;background:var(--paper);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px -18px rgba(31,45,36,.25)}
.bk__info{padding:24px;border-right:1px solid var(--line);display:grid;gap:10px;align-content:start}
.bk__info h2{font-size:24px}
.bk__meta{display:grid;gap:8px;font-size:14px;color:var(--muted)}
.bk__meta span{display:flex;gap:8px;align-items:center}
.bk__meta svg{width:16px;height:16px;flex:none;color:var(--cta-2)}
.bk__cal{padding:22px 24px;display:grid;gap:14px;align-content:start}
.bk__times{padding:22px 16px;border-left:1px solid var(--line);display:grid;gap:8px;align-content:start;max-height:520px;overflow-y:auto}
.mcal__h{display:flex;justify-content:space-between;align-items:center}
.mcal__h b{font-weight:500;font-size:16px;text-transform:capitalize}
.mcal__nav{display:flex;gap:6px}
.mcal__nav button{width:34px;height:34px;border-radius:50%;border:0;background:var(--cal-free);color:var(--cal-free-ink);font-size:16px}
.mcal__nav button[disabled]{background:transparent;color:var(--muted);opacity:.4}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.mcal__dw{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 0}
.mcal__d{aspect-ratio:1;max-width:46px;width:100%;justify-self:center;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;position:relative}
.mcal__d.av{background:var(--cal-free);color:var(--cal-free-ink);font-weight:600}
.mcal__d.av:hover{background:var(--cta);color:var(--on-cta)}
.mcal__d[aria-pressed="true"]{background:var(--cta);color:var(--on-cta)}
.mcal__d.today::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.mcal__d[disabled]{cursor:default}
.tz{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tslot{display:grid;grid-template-columns:1fr;gap:6px}
.tslot.sel{grid-template-columns:1fr 1fr}
.tslot button{border:1px solid var(--cta);color:var(--cta-2);background:transparent;border-radius:10px;padding:12px 0;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.tslot button:hover{border-width:2px;padding:11px 0}
.tslot.sel .t{background:var(--muted);border-color:var(--muted);color:var(--paper)}
.tslot.sel .go{background:var(--cta);color:var(--on-cta)}
.bk__times h3{font-size:15px;font-family:var(--sans);font-weight:500;margin-bottom:4px}
@media (max-width:900px){.bk{grid-template-columns:minmax(0,1fr)}.bk__info{border-right:0;border-bottom:1px solid var(--line)}.bk__times{border-left:0;border-top:1px solid var(--line);max-height:none}}

/* ===== Agenda visual ===== */
.ag{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.ag{grid-template-columns:minmax(0,1fr)}.ag__side{order:2}}
.ag__side{display:grid;gap:14px}
.ag__bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ag__nav{display:flex;gap:6px;align-items:center}
.ag__nav .rnd{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:var(--paper);font-size:16px}
.ag__title{font-family:var(--display);font-size:22px}
.wk{border:1px solid var(--line);border-radius:16px;background:var(--paper);overflow:hidden}
.wk__scroll{overflow-x:auto}
.wk__in{display:grid;grid-template-columns:56px repeat(var(--cols),minmax(110px,1fr));min-width:calc(56px + var(--cols)*110px)}
.wk__head{display:contents}
.wk__hd{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;background:var(--paper);position:sticky;top:0}
.wk__hd b{display:block;font-family:var(--display);font-size:22px;font-weight:400;color:var(--ink);letter-spacing:0;text-transform:none}
.wk__hd.today b{background:var(--cta);color:var(--on-cta);width:36px;height:36px;line-height:36px;border-radius:50%;margin:2px auto 0}
.wk__hd.closed{opacity:.5}
.wk__hours{position:relative;border-right:1px solid var(--line)}
.wk__hours span{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.wk__col{position:relative;border-right:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hp));cursor:copy}
.wk__col:last-child{border-right:0}
.wk__col.closed{background-color:var(--oat);cursor:default}
.wk__col.today{background-color:color-mix(in srgb,var(--cta-soft) 45%,transparent)}
.ev{position:absolute;left:4px;right:4px;border-radius:10px;padding:5px 8px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;border:0;text-align:left;color:var(--ink);background:color-mix(in srgb,var(--evc) 20%,var(--paper));box-shadow:inset 3px 0 0 var(--evc);display:grid;align-content:start;justify-items:start;gap:1px}
.ev:hover{background:color-mix(in srgb,var(--evc) 32%,var(--paper));z-index:2}
.ev b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.ev .tm{font-size:11px;color:var(--evc);font-weight:600;font-variant-numeric:tabular-nums}
.ev.hold{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--evc) 14%,var(--paper)) 0 6px,var(--paper) 6px 12px);box-shadow:inset 0 0 0 1px var(--evc)}
.ev.paid{opacity:.7}
.ev.cancelled,.ev.noshow,.ev.expired{display:none}
.ev .flag{position:absolute;top:4px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.ev.blk{--evc:var(--c-blk);background:repeating-linear-gradient(135deg,var(--oat) 0 6px,var(--paper) 6px 12px);box-shadow:none;color:var(--muted);cursor:default}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.legend{display:grid;gap:6px;font-size:13px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--lc)}
.mini-cal .mcal__d{font-size:13px;max-width:32px}
.mini-cal .mcal__d.has{color:var(--ink);font-weight:600}

<script>
/* Modo servidor (Railway): si no estamos dentro de Claude, conectar a la API propia */
(function(){
  if(window.claude||!/^https?:$/.test(location.protocol))return;
  const api=async(p,b)=>{const r=await fetch(p,{method:b?'POST':'GET',headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined,credentials:'same-origin',cache:'no-store'});
    if(r.status===401){location.href='/login';throw {code:'revoked'}}if(!r.ok)throw {code:'unavailable'};return r.json()};
  let cache={},rev=-1,subs=[];
  const meta={fromCache:false,hasPendingWrites:false};
  const snap=c=>{const docs=Object.entries(cache[c]||{}).map(([id,d])=>({id,exists:true,data:()=>d,metadata:meta}));return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:meta}};
  const emit=()=>subs.forEach(s=>{try{s.next(snap(s.c))}catch(e){console.error(e)}});
  let pulling=false;async function pull(){if(pulling)return;pulling=true;try{const r=await api('/api/db?rev='+rev);if(r.rev!==rev&&r.data){rev=r.rev;cache=r.data;emit()}}catch(e){}finally{pulling=false}}
  let timer=null;function start(){if(timer)return;pull();timer=setInterval(pull,4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()})}
  const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
  const merge=(a,b)=>{const o={...(a||{})};for(const k in b){o[k]=isObj(b[k])&&isObj(o[k])?merge(o[k],b[k]):b[k]}return o};
  async function write(op,c,id,data){cache[c]=cache[c]||{};
    if(op==='set')cache[c][id]=data;if(op==='update')cache[c][id]=merge(cache[c][id],data);if(op==='delete')delete cache[c][id];emit();
    const r=await api('/api/db',{op,c,id,data});if(r&&typeof r.rev==='number')rev=r.rev}
  const db={collection(c){return {onSnapshot(next){const s={c,next};subs.push(s);start();if(rev>=0)next(snap(c));return()=>{subs=subs.filter(x=>x!==s)}},
    doc(id){return {set:d=>write('set',c,id,d),update:d=>write('update',c,id,d),delete:()=>write('delete',c,id)}}}}};
  const sample=async(input,opts={})=>{let r;
    try{r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({input,tier:opts.modelTier||'default'}),signal:opts.signal,credentials:'same-origin'})}
    catch(e){throw {code:opts.signal&&opts.signal.aborted?'cancelled':'upstream_error'}}
    if(!r.ok)throw {code:r.status===429?'rate_limited':r.status===503?'sampling_disabled':'upstream_error'};
    const j=await r.json();if(opts.onText)opts.onText({text:j.text,delta:j.text});return {text:j.text,truncated:!!j.truncated,modelTierApplied:opts.modelTier||'default'}};
  sample.json=async(input,opts={})=>{const add='\n\nResponde únicamente con JSON válido, sin texto antes ni después.';
    const inp=typeof input==='string'?input+add:input.map((m,i)=>i===input.length-1?{...m,content:m.content+add}:m);
    const {text}=await sample(inp,opts);const t=String(text).trim();
    const tries=[t,(t.match(/```(?:json)?\s*([\s\S]*?)```/)||[])[1],t.slice(Math.min(...['{','['].map(x=>t.indexOf(x)).filter(i=>i>=0)),Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'))+1)];
    for(const x of tries){if(!x)continue;try{return JSON.parse(x)}catch(e){}}throw {code:'invalid_json',text:t}};
  sample.limits=async()=>({maxPromptBytes:262144});
  const downloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);return {status:'saved'}}};
  let aiOn=null;
  window.MT_HOSTED=true;
  window.claude={use:async n=>{if(n==='db')return db;if(n==='downloads')return downloads;
    if(n==='sample'){if(aiOn===null){try{aiOn=!!(await api('/api/ai/status')).on}catch(e){aiOn=false}}return aiOn?sample:null}return null}};
})();
</script>

function resizeImage(file,max=640,q=0.72){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
function sigPad(canvas){const ctx=canvas.getContext('2d');let drawing=false,dirty=false,last=null;
  const fit=()=>{const r=canvas.getBoundingClientRect();canvas.width=Math.max(300,r.width*2);canvas.height=300;ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1A1A1A'};fit();
  const pos=e=>{const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};
  canvas.onpointerdown=e=>{drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId)};
  canvas.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p;dirty=true};
  canvas.onpointerup=canvas.onpointercancel=()=>{drawing=false};
  const api={clear(){ctx.clearRect(0,0,canvas.width,canvas.height);dirty=false},isEmpty:()=>!dirty,
    data(){const c=document.createElement('canvas');c.width=480;c.height=160;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,480,160);x.drawImage(canvas,0,0,480,160);return c.toDataURL('image/png')}};canvas._pad=api;return api}

/* ----- Agenda ----- */
function effStatus(b){ if(b.status==='hold'&&b.holdUntil&&Date.parse(b.holdUntil)<Date.now()) return 'expired'; return b.status }
const ACTIVE=new Set(['hold','confirmed','done','paid']);
function busyOn(date){const out=[];
  D.bookings.forEach(b=>{if(b.date===date&&ACTIVE.has(effStatus(b)))out.push([toMin(b.start),toMin(b.start)+b.dur])});
  D.blocks.forEach(k=>{if(k.date===date)out.push([toMin(k.start),toMin(k.end)])}); return out}
function slotsFor(date,dur){const d=parseYmd(date);if(d.getDay()===0)return [];
  const busy=busyOn(date),now=new Date(),isT=today()===date,nm=now.getHours()*60+now.getMinutes(),res=[];
  for(let t=OPEN;t+dur<=CLOSE;t+=STEP){if(isT&&t<nm+60)continue;if(busy.some(([a,b])=>t<b&&t+dur>a))continue;res.push(t)}return res}
function upcomingDays(n,from){const out=[];const d=from?parseYmd(from):new Date();d.setHours(0,0,0,0);for(let i=0;i<n;i++){out.push(new Date(d));d.setDate(d.getDate()+1)}return out}
function weekRange(off=0){const d=new Date();d.setHours(0,0,0,0);const dow=(d.getDay()+6)%7;const a=new Date(d);a.setDate(d.getDate()-dow+off*7);const b=new Date(a);b.setDate(a.getDate()+6);return [ymd(a),ymd(b)]}
const hoursUntil=b=>(new Date(parseYmd(b.date).getTime()+toMin(b.start)*6e4)-Date.now())/36e5;

function payments(){
  const out=[];const P=(o)=>out.push(o);
  D.bookings.forEach(b=>{
    if(b.depositPaid&&!b.depositRefunded&&b.status!=='expired') P({date:isoDay(b.depositPaidAt||b.createdAt)||b.date,amount:b.deposit||0,kind:'Depósito',cat:b.category,svc:b.serviceName,client:b.client?.name,cid:b.clientId,method:b.depositMethod||'',bid:b.id,staff:b.staffId||'mt'});
    if(b.finalPaid&&b.finalAmount) P({date:isoDay(b.paidAt)||b.date,amount:b.finalAmount,kind:'Saldo',cat:b.category,svc:b.serviceName,client:b.client?.name,cid:b.clientId,method:b.finalMethod||'',bid:b.id,staff:b.staffId||'mt'});
    if(b.tip) P({date:isoDay(b.paidAt)||b.date,amount:b.tip,kind:'Propina',cat:'Propinas',svc:b.serviceName,client:b.client?.name,cid:b.clientId,method:b.finalMethod||'',bid:b.id,tip:true,staff:b.staffId||'mt'});
  });
  D.cpackages.forEach(p=>P({date:isoDay(p.purchasedAt),amount:p.paidAmount||0,kind:'Paquete',cat:'Paquetes',svc:p.name,client:p.clientName,cid:p.clientId,method:p.method||'',bid:p.id}));
  D.memberships.forEach(m=>(m.charges||[]).forEach(c=>P({date:c.date,amount:c.amount,kind:'Membresía',cat:'Membresías',svc:MEMB.name,client:m.clientName,cid:m.clientId,method:c.method||'',bid:m.id+c.date})));
  D.sales.forEach(s=>P({date:isoDay(s.at),amount:s.subtotal||0,kind:'Productos',cat:'Productos',svc:(s.items||[]).map(i=>i.name).join(', '),client:s.clientName,cid:s.clientId,method:s.method||'',bid:s.id,tax:s.tax||0}));
  D.giftcards.forEach(g=>P({date:isoDay(g.soldAt),amount:g.amount||0,kind:'Tarjeta de regalo',cat:'Tarjetas de regalo',svc:g.code,client:g.buyer,method:g.method||'',bid:g.id}));
  return out}

/* ----- Clientas ----- */
function clientStats(cid){
  const bs=D.bookings.filter(b=>b.clientId===cid).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  const visits=bs.filter(b=>['paid','done'].includes(b.status));
  const t=today(); const next=bs.find(b=>b.date>=t&&['confirmed','hold'].includes(effStatus(b)));
  const spent=payments().filter(p=>p.cid===cid&&!p.tip).reduce((a,p)=>a+p.amount,0);
  const last=visits.length?visits[visits.length-1].date:null;
  return {bs,visits:visits.length,spent,last,next,cats:[...new Set(visits.map(b=>b.category))],noshows:bs.filter(b=>b.status==='noshow').length,days:last?daysBetween(last,t):null};
}
const refCode=c=>c?(first(c.name).normalize('NFD').replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,8)+'-'+c.id.slice(-3).toUpperCase()):'';

const needsFullPay=c=>c&&clientStats(c.id).noshows>=SET().fullPayAfterNoShows;
const activeMemb=cid=>D.memberships.find(m=>m.clientId===cid&&m.status==='activa');
const activePkgs=cid=>D.cpackages.filter(p=>p.clientId===cid&&p.used<p.sessions);
function findClient(phone,email){const p=digits(phone);
  return D.clients.find(c=>(p&&digits(c.phone)===p)||(email&&c.email&&c.email.toLowerCase()===String(email).toLowerCase()))||null}
async function upsertClient(data){
  const ex=findClient(data.phone,data.email);
  if(ex){const patch={};['email','phone','ig'].forEach(k=>{if(data[k]&&!ex[k])patch[k]=data[k]});
    if(data.flags?.length){const f=[...new Set([...(ex.flags||[]),...data.flags])];if(f.length!==(ex.flags||[]).length)patch.flags=f}
    if(data.referredBy&&!ex.referredBy)patch.referredBy=data.referredBy;
    if(Object.keys(patch).length) await store.patch('clients',ex.id,patch); return ex.id}
  const id='c-'+uid(); await store.put('clients',id,{name:data.name,phone:data.phone||'',email:data.email||'',ig:data.ig||'',birthday:'',skinType:'',flags:data.flags||[],notes:data.notes||'',tags:[],source:data.source||'web',referredBy:data.referredBy||'',credit:0,marketingOk:!!data.marketingOk,createdAt:nowIso()});
  return id;
}

function feed(n){const ev=[];

  D.followups.filter(f=>f.sentAt).forEach(f=>ev.push({t:f.sentAt,text:`${f.clientName} · ${FU_TYPES[f.type]} enviado`}));
  D.followups.filter(f=>f.answeredAt).forEach(f=>ev.push({t:f.answeredAt,text:`${f.clientName} calificó su visita: ${f.rating}/5`}));
  D.social.forEach(s=>ev.push({t:s.at,text:`${PLAT[s.platform]||s.platform} · ${s.platform==='google'?'★'.repeat(s.rating||0)+' ':''}${s.authorName||'@'+s.author}: “${String(s.text).slice(0,60)}${s.text.length>60?'…':''}”`}));
  D.campaigns.filter(c=>c.sentAt).forEach(c=>ev.push({t:c.sentAt,text:`Oferta “${c.name}” enviada a ${c.recipients?.length||0} clientas`}));
  D.sales.forEach(s=>ev.push({t:s.at,text:`Venta de productos · ${s.clientName||'mostrador'} · ${money(s.total)}`}));
  D.cpackages.forEach(p=>ev.push({t:p.purchasedAt,text:`${p.clientName} compró ${p.name}`}));
  D.waitlist.forEach(w=>ev.push({t:w.createdAt,text:`${w.name} se anotó en lista de espera · ${w.serviceName}`}));
  ev.sort((a,b)=>String(b.t).localeCompare(String(a.t)));

  return `<div class="rows">${ev.slice(0,n).map(e=>{const d=new Date(e.t);return `<div class="small" style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px"><time class="muted num">${isNaN(d)?'':shortD(ymd(d))+' '+pad(d.getHours())+':'+pad(d.getMinutes())}</time><span>${esc(e.text)}</span></div>`}).join('')}</div>`}

function weekOf(day){const d=parseYmd(day);const dow=(d.getDay()+6)%7;const a=new Date(d);a.setDate(d.getDate()-dow);return ymd(a)}
RENDER.agenda=()=>{
  if(!OS.agView)OS.agView=innerWidth<760?'dia':'semana';
  const v=OS.agView,t=today();
  const ws=weekOf(OS.day);const days=v==='semana'?[0,1,2,3,4,5].map(i=>addDays(ws,i)):[OS.day];
  const title=v==='semana'?`${shortD(days[0])} – ${shortD(days[5])} ${days[5].slice(0,4)}`:longDate(OS.day);
  const HP=innerWidth<760?54:64;
  const hourLabels=[];for(let h=OPEN/60;h<=CLOSE/60;h++)hourLabels.push(`<span style="top:${(h*60-OPEN)/60*HP}px">${h===12?'12 pm':h>12?(h-12)+' pm':h+' am'}</span>`);
  const H=(CLOSE-OPEN)/60*HP;
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  const col=k=>{const closed=parseYmd(k).getDay()===0;
    const ev=D.bookings.filter(b=>b.date===k&&!['cancelled','noshow','expired'].includes(effStatus(b))).map(b=>{const st=effStatus(b);const c=byId('clients',b.clientId);const cf=contraFor(b.serviceId,c?.flags||b.flags);const warn=cf.block.length||(needsConsent(b.serviceId)&&!b.consentId&&['hold','confirmed'].includes(st));

    const bl=D.blocks.filter(x=>x.date===k).map(x=>`<div class="ev blk" style="top:${(toMin(x.start)-OPEN)/60*HP+1}px;height:${(toMin(x.end)-toMin(x.start))/60*HP-3}px"><span class="tm" style="color:var(--muted)">${hm12(toMin(x.start))}</span><b>${esc(x.reason||'Bloqueado')}</b><button class="btn btn--sm btn--ghost" data-unblock="${x.id}" style="justify-self:start;padding:1px 6px;font-size:11px">Quitar</button></div>`).join('');

  const grid=`<div class="wk"><div class="wk__scroll"><div class="wk__in" style="--cols:${days.length};--hp:${HP/2}px;${days.length===1?'min-width:0':''}">
    <div class="wk__hd" style="cursor:default"></div>${days.map(k=>{const d=parseYmd(k);return `<div class="wk__hd ${k===t?'today':''} ${d.getDay()===0?'closed':''}" data-dayview="${k}">${DOW[d.getDay()]}<b>${d.getDate()}</b></div>`}).join('')}
    <div class="wk__hours" style="height:${H}px">${hourLabels.join('')}</div>${days.map(col).join('')}
  </div></div></div>`;
  // mini calendario del mes
  const [yy,mm]=OS.day.slice(0,7).split('-').map(Number);const lead=(new Date(yy,mm-1,1).getDay()+6)%7,nd=new Date(yy,mm,0).getDate();
  const mini=[];for(let i=0;i<lead;i++)mini.push('<span></span>');
  for(let d=1;d<=nd;d++){const k=`${yy}-${pad(mm)}-${pad(d)}`;const has=D.bookings.some(b=>b.date===k&&ACTIVE.has(effStatus(b)));const inwk=v==='semana'&&days.includes(k);
    mini.push(`<button class="mcal__d ${has?'has':''} ${inwk?'inwk':''} ${k===t?'today':''}" data-day="${k}" aria-pressed="${k===OS.day}" aria-label="${esc(longDate(k))}">${d}</button>`)}
  const wl=D.waitlist.filter(w=>w.status==='esperando');
  const dayItems=[...D.bookings.filter(b=>b.date===OS.day).map(b=>({k:'b',t:toMin(b.start),b})),...D.blocks.filter(k=>k.date===OS.day).map(k=>({k:'k',t:toMin(k.start),x:k}))].sort((a,b)=>a.t-b.t);
  const list=`<div class="panel">${dayItems.length?dayItems.map(it=>it.k==='k'?`<div class="blockrow"><span><b class="num">${hm12(toMin(it.x.start))}–${hm12(toMin(it.x.end))}</b> · Bloqueado${it.x.reason?' · '+esc(it.x.reason):''}</span><button class="btn btn--sm btn--ghost" data-unblock="${it.x.id}">Quitar</button></div>`:apptRow(it.b)).join(''):`<div class="panel__b"><div class="empty">Sin citas este día.</div></div>`}</div>`;
  return `<div class="ag__bar"><div class="ag__nav"><button class="btn btn--sm" data-agtoday>Hoy</button><button class="rnd" data-agmove="-1" aria-label="Anterior">‹</button><button class="rnd" data-agmove="1" aria-label="Siguiente">›</button><span class="ag__title">${esc(title)}</span></div>
    <div class="ag__nav"><div class="seg" role="group" aria-label="Vista">${[['dia','Día'],['semana','Semana'],['lista','Lista']].map(([k,l])=>`<button data-agview="${k}" aria-pressed="${v===k}">${l}</button>`).join('')}</div><button class="btn" data-x="block">Bloquear</button><button class="btn btn--pri" data-x="manual">+ Cita</button></div></div>
  ${lsGet('mt-tip-ag',false)?'':`<p class="tip">Toca un espacio vacío para crear una cita a esa hora; toca una cita para cobrar, moverla o cancelarla. El punto rojo avisa que falta una firma o hay que revisar la salud. <button data-tipok>Entendido</button></p>`}
  <div class="ag"><div class="ag__side">
    <div class="panel"><div class="panel__b mini-cal"><div class="mcal__h"><b>${MONL[mm-1]} ${yy}</b><div class="mcal__nav"><button data-agmonth="-1" aria-label="Mes anterior">‹</button><button data-agmonth="1" aria-label="Mes siguiente">›</button></div></div>
      <div class="mcal">${['l','m','m','j','v','s','d'].map(d=>`<span class="mcal__dw">${d}</span>`).join('')}${mini.join('')}</div></div></div>
    <div class="panel"><div class="panel__b legend">${[['Faciales','Faciales'],['Masajes','Masajes'],['Wax · Mujeres','Wax'],['HIFU','HIFU'],['Consulta','Consulta']].map(([c,l])=>`<span><i style="--lc:${catVar(c)}"></i>${l}</span>`).join('')}<span><i style="--lc:transparent;border:1px dashed var(--line-2)"></i>Esperando pago</span></div></div>
    ${wl.length?`<button class="btn btn--cu" data-goto="ventas" data-ventab="espera">${wl.length} en lista de espera →</button>`:''}
  </div><div>${v==='lista'?list:grid}</div></div>`;
};
function openAppt(id){const b=byId('bookings',id);if(!b)return;
  dialog(`<div class="dlg__h"><div><span class="eyebrow">${esc(longDate(b.date))}</span><h2>${hm12(toMin(b.start))} · ${esc(b.serviceName)}</h2></div><button type="button" data-close aria-label="Cerrar">×</button></div>
    <div class="panel" style="overflow:hidden">${apptRow(b)}</div>`,async()=>{});
}
async function doAct(a,id){const b=byId('bookings',id);if(!b)return;
  if(a==='confirm'){await addLog(b,'Confirmada por María Teresa sin depósito',{status:'confirmed',holdUntil:null});await scheduleReminders(b);toast('Cita confirmada')}
  if(a==='cancel')openCancel(b,false);
  if(a==='noshow')openCancel(b,true);
  if(a==='finish')openFinish(b);
  if(a==='consent')openConsent(b);
  if(a==='move')openMove(b);
  if(a==='copy'){try{await navigator.clipboard.writeText(b.payLink);toast('Link copiado')}catch(_){toast('Selecciona el link para copiarlo')}}
  if(a==='clientpays')openPay({amount:b.finalAmount,title:'Saldo · '+b.serviceName,desc:b.client?.name||'',tip:true,onPaid:async(m,tip)=>{await addLog(b,`Pagó el saldo de ${money(b.finalAmount)} con ${m}${tip?' + propina '+money(tip):''}`,{status:'paid',finalPaid:true,finalMethod:m,tip:tip||0,paidAt:nowIso()})}});
}
$('main').addEventListener('click',e=>{
  if(e.target.closest('[data-tipok]')){lsSet('mt-tip-ag',true);e.stopImmediatePropagation();render();return}
  const t=e.target.closest('[data-agview],[data-agmove],[data-agtoday],[data-agmonth],[data-dayview],[data-appt]');
  if(t){e.stopImmediatePropagation();
    if(t.dataset.appt){openAppt(t.dataset.appt);return}
    if(t.dataset.agview){OS.agView=t.dataset.agview;render();return}
    if(t.dataset.dayview){OS.day=t.dataset.dayview;OS.agView='dia';render();return}
    if(t.hasAttribute('data-agtoday')){OS.day=today();render();return}
    if(t.dataset.agmove){OS.day=addDays(OS.day,(+t.dataset.agmove)*(OS.agView==='semana'?7:1));render();return}
    if(t.dataset.agmonth){const d=parseYmd(OS.day);const n=new Date(d.getFullYear(),d.getMonth()+(+t.dataset.agmonth),1);OS.day=ymd(n);render();return}}
  const c=e.target.closest('.wk__col');
  if(c&&!e.target.closest('.ev')&&!c.classList.contains('closed')){e.stopImmediatePropagation();const r=c.getBoundingClientRect();const HP=innerWidth<760?54:64;
    let m=OPEN+Math.floor((e.clientY-r.top)/HP*2)*30;m=Math.max(OPEN,Math.min(m,CLOSE-30));openManual(null,{date:c.dataset.slotday,time:toHM(m)})}
},true);

function openFinish(b){
  const st=SET(),c=byId('clients',b.clientId)||{},dep=b.depositPaid&&!b.depositRefunded?b.deposit:0;
  const pk=activePkgs(b.clientId).find(p=>p.serviceId===b.serviceId);
  const mb=activeMemb(b.clientId);const mbOk=mb&&b.serviceId===MEMB.serviceId&&mb.lastUsedMonth!==today().slice(0,7);
  const firstVisit=clientStats(b.clientId).visits===0;const refDisc=b.referredBy&&firstVisit?st.referral.receiver:0;
  const credit=c.credit||0;
  const uses=useFor(b.serviceId).map(([pid,q])=>{const p=byId('products',pid);return p?`${q} ${p.unit} ${p.name}`:null}).filter(Boolean);
  const cons=needsConsent(b.serviceId);
  dialog(`<div class="dlg__h"><div><span class="eyebrow">Terminar y cobrar</span><h2>${esc(b.client?.name)}</h2></div><button type="button" data-close aria-label="Cerrar">×</button></div>
    <p class="muted">${esc(b.serviceName)} · ${shortD(b.date)} ${hm12(toMin(b.start))}</p>
    ${cons&&!b.consentId?`<div class="badbox">Este tratamiento no tiene consentimiento firmado. <button type="button" class="btn btn--sm btn--cu" data-signnow="${b.id}" style="margin-left:6px">Firmar ahora</button></div>`:''}
    <div class="row2"><div class="field"><label for="d-total">Precio del servicio</label><input class="inp num" id="d-total" type="number" min="0" step="1" value="${b.priceFrom||0}"></div>
    <div class="field"><label for="d-staff">Lo hizo</label><select class="inp" id="d-staff">${st.staff.map(s=>`<option value="${s.id}" ${s.id===(b.staffId||'mt')?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div></div>
    <div class="field"><span class="lbl">Aplicar</span><div class="checks">
      ${pk?`<label class="chk"><input type="checkbox" id="d-pk" checked> Sesión del paquete (${pk.sessions-pk.used} de ${pk.sessions} restantes)</label>`:''}
      ${mbOk?`<label class="chk"><input type="checkbox" id="d-mb" checked> Facial incluido en la membresía</label>`:''}
      ${refDisc?`<label class="chk"><input type="checkbox" id="d-ref" checked> Descuento de referida ${money(refDisc)}</label>`:''}
      ${credit?`<label class="chk"><input type="checkbox" id="d-cred"> Usar crédito de referidos (${money(credit)})</label>`:''}
      ${!pk&&!mbOk&&!refDisc&&!credit?'<span class="mini">Sin paquetes, membresía ni créditos para este servicio.</span>':''}</div></div>
    <div class="row2"><div class="field"><label for="d-gc">Tarjeta de regalo <em>(código)</em></label><input class="inp" id="d-gc" placeholder="GC-XXXX"></div><div class="field"><label for="d-disc">Descuento manual $</label><input class="inp num" id="d-disc" type="number" min="0" value="0"></div></div>
    <div id="d-sum"></div>
    <div class="field"><label for="d-notes">Notas de la sesión</label><textarea class="inp" id="d-notes" rows="3" placeholder="Cómo estaba la piel, qué se hizo, cómo reaccionó…"></textarea></div>
    <div class="field"><label for="d-params">Parámetros y productos usados</label><input class="inp" id="d-params" placeholder="${b.category==='HIFU'?'Ej. cartucho 4.5 mm, 300 disparos, energía 0.8 J':'Ej. enzimas de papaya, mascarilla calmante'}"></div>
    <div class="row2"><div class="field"><label for="d-before">Foto antes</label><input class="inp" id="d-before" type="file" accept="image/*" capture="environment"></div><div class="field"><label for="d-after">Foto después</label><input class="inp" id="d-after" type="file" accept="image/*" capture="environment"></div></div>
    <label class="chk"><input type="checkbox" id="d-mkt" ${c.marketingOk||b.marketingOk?'checked':''}> La clienta autoriza usar estas fotos en redes</label>
    <div class="note small"><b>Al guardar, el sistema:</b> genera el link de pago (con opción de propina) · descuenta del inventario: ${esc(uses.join(', ')||'nada')} · programa cuidados y encuesta (mañana) y recordatorio para volver (en ${REBOOK_DAYS[b.category]||30} días)${b.referredBy&&firstVisit?` · da ${money(st.referral.giver)} de crédito a quien la refirió`:''}</div>
    <button class="btn btn--pri btn--block" type="submit">Terminar y cobrar</button>`,
    async()=>{const calc=finCalc();
      if(calc.gcErr){toast(calc.gcErr);return false}
      const staffId=$('d-staff').value,notes=$('d-notes').value.trim(),params=$('d-params').value.trim(),mkt=$('d-mkt').checked;
      const covered=[];if(calc.pk)covered.push('paquete');if(calc.mb)covered.push('membresía');if(calc.gc)covered.push('tarjeta de regalo '+calc.gc.code);
      const patch={staffId,sessionNotes:notes,sessionParams:params,marketingOk:mkt,finalDiscounts:calc.lines,covered:covered.join(', ')};
      // fotos
      for(const [id,kind] of [['d-before','antes'],['d-after','después']]){const f=$(id).files?.[0];if(f){try{const data=await resizeImage(f);await store.put('photos','ph-'+uid(),{clientId:b.clientId,clientName:b.client?.name,bookingId:b.id,serviceName:b.serviceName,kind,data,marketingOk:mkt,at:nowIso()})}catch(_){toast('No se pudo leer una foto')}}}
      if(calc.pk)await store.patch('cpackages',calc.pk.id,{used:calc.pk.used+1,uses:[...(calc.pk.uses||[]),{date:b.date,bookingId:b.id}]});
      if(calc.mb)await store.patch('memberships',calc.mb.id,{lastUsedMonth:today().slice(0,7)});
      if(calc.gc)await store.patch('giftcards',calc.gc.id,{balance:r2(calc.gc.balance-calc.gcUsed),redemptions:[...(calc.gc.redemptions||[]),{date:today(),amount:calc.gcUsed,bookingId:b.id}]});
      if(calc.cred)await store.patch('clients',b.clientId,{credit:r2(credit-calc.cred)});
      if(b.referredBy&&firstVisit){const rc=byId('clients',b.referredBy);if(rc)await store.patch('clients',rc.id,{credit:r2((rc.credit||0)+st.referral.giver)})}
      if(mkt&&!c.marketingOk&&c.id)await store.patch('clients',c.id,{marketingOk:true});
      if(calc.rest<=0)await addLog(b,`Servicio terminado · ${calc.lines.length?calc.lines.map(l=>l[0]).join(', '):'cubierto por el pago previo'}`,{...patch,status:'paid',finalAmount:0,finalPaid:true,finalMethod:dep?'depósito':'—',paidAt:nowIso()});
      else await addLog(b,`Servicio terminado · link de pago por ${money(calc.rest)} enviado`,{...patch,status:'done',finalAmount:calc.rest,payLink:`https://pay.mtaesthetics.nyc/p/${uid().slice(0,8)}`});
      await onServiceFinished(byId('bookings',b.id)||b);toast('Listo: cobro, inventario, fotos y seguimientos actualizados')},true);
  const finCalc=()=>{const tot=Math.max(+$('d-total').value||0,0);let rest=tot;const lines=[];let pkU=null,mbU=null,gc=null,gcUsed=0,cred=0,gcErr='';
    if($('d-pk')?.checked){pkU=pk;lines.push(['Sesión de paquete',-rest]);rest=0}
    if(rest>0&&$('d-mb')?.checked){mbU=mb;lines.push(['Membresía',-rest]);rest=0}
    if(rest>0&&$('d-ref')?.checked){const v=Math.min(refDisc,rest);lines.push(['Descuento referida',-v]);rest-=v}
    const md=Math.max(+$('d-disc').value||0,0);if(rest>0&&md){const v=Math.min(md,rest);lines.push(['Descuento',-v]);rest-=v}
    if(rest>0&&$('d-cred')?.checked){cred=Math.min(credit,rest);lines.push(['Crédito de referidos',-cred]);rest-=cred}

  if(t.dataset.wlnotify){const w=byId('waitlist',t.dataset.wlnotify);const s=SVC[w.serviceId];let found=null;for(const d of upcomingDays(14,w.date&&w.date>=today()?w.date:today())){const sl=slotsFor(ymd(d),s.dur);if(sl.length){found=[ymd(d),sl[0]];break}}
    if(!found){toast('No hay horarios libres en 2 semanas.');return}
    await addFU({type:'waitlist',due:today(),clientName:w.name,waitlistId:w.id,channel:'sms',message:`Hola ${first(w.name)}, tenemos un horario para tu ${s.name}: ${longDate(found[0])} a las ${hm12(found[1])}. Resérvalo aquí: mtaesthetics.nyc/reservar`});
    await store.patch('waitlist',w.id,{status:'avisada',notifiedAt:nowIso()});toast('Aviso listo en Seguimiento');return}
  if(t.dataset.delstaff){const st=SET();await saveSettings({staff:st.staff.filter(s=>s.id!==t.dataset.delstaff)});return}
  if(t.dataset.deltpl!==undefined){const st=SET();await saveSettings({templates:st.templates.filter((_,i)=>i!==+t.dataset.deltpl)});return}
  const x=t.dataset.x;
  const X={manual:()=>openManual(t.dataset.cid),block:openBlock,newclient:openNewClient,campaign:()=>openCampaign(),product:openProduct,expense:openExpense,'ask-brief':()=>brief(),
    clearchat:()=>{OS.chat=[];OS.actions=[];render()},sell:()=>openSell(t.dataset.cid),sellpkg:()=>openSellPkg(t.dataset.cid,t.dataset.pkg),sellmemb:()=>openSellMemb(t.dataset.cid),sellgift:openSellGift,
    chargememb:chargeMemberships,bdays:birthdays,mkorders:makeOrders,close:openClose,export:openExport,post:()=>openPost(null,t.dataset.date),ideas:()=>contentIdeas(t),pin:openPin,staff:openStaff,tpl:openTpl,wipe:openWipe};
  if(x&&X[x])return X[x]();
  try{
    if(t.dataset.act){await doAct(t.dataset.act,t.dataset.id)}
    if(t.dataset.fu){const a=t.dataset.fu;const f=byId('followups',t.dataset.id);
      if(a==='send'){await store.patch('followups',f.id,{status:'sent',sentAt:nowIso()});toast(`Enviado a ${first(f.clientName)} (simulado)`)}
      if(a==='done'){await store.patch('followups',f.id,{status:'sent',sentAt:nowIso()});toast('Marcado como hecho')}
      if(a==='skip'){await store.patch('followups',f.id,{status:'skipped'});toast('Omitido')}

    if(t.dataset.soc){const s=byId('social',t.dataset.id);const a=t.dataset.soc;const ta=$('rp-'+s.id);
      if(a==='reply'){const r=ta.value.trim();if(!r){toast('Escribe la respuesta primero.');ta.focus();return}await store.patch('social',s.id,{status:'replied',reply:r,repliedAt:nowIso()});toast('Respuesta publicada (simulado)')}

      if(a==='lead'){const nm=s.authorName||('@'+s.author);const cid=await upsertClient({name:nm,ig:'@'+s.author,source:PLAT[s.platform]||s.platform,notes:`Escribió en ${PLAT[s.platform]}: “${s.text}”`});

        toast('Guardada en Clientas con un mensaje para hoy')}

        try{const r=await sample.json(`Eres María Teresa de MT Aesthetics · The Parlour (estética en NYC, 20 años de oficio, una clienta a la vez, reservas en mtaesthetics.nyc/reservar). Precios de referencia: ${snapshot().servicios}. Responde a ${s.platform==='google'?`esta reseña de Google de ${s.rating} estrellas (si es mala, agradece, pide disculpas sin excusas e invita a hablar en privado)`:`este ${s.kind==='dm'?'mensaje directo':'comentario público'} de ${PLAT[s.platform]}`}. Tono cálido, breve (máx. 45 palabras), en el idioma de la persona. Si quiere reservar, invítala con el link. Clasifica la intención: reservar, pregunta, elogio, queja, spam, resena. Responde solo JSON {"intent":"...","reply":"..."}.\n\nTexto: "${s.text}"${s.post?`\nPublicación: ${s.post}`:''}`,{modelTier:'quick',cache:false});
          ta.value=r?.reply||old; if(r?.intent&&INTENT[r.intent]&&r.intent!==s.intent&&s.platform!=='google')await store.patch('social',s.id,{intent:r.intent,draft:ta.value});
        }catch(err){ta.value=old;toast(aiErr(err)||'No se pudo sugerir')}finally{t.disabled=false}}}
    if(t.dataset.inv){const p=byId('products',t.dataset.id);if(t.dataset.inv==='in')openRestock(p);else openMoves(p)}
    if(t.dataset.ord){const o=byId('orders',t.dataset.id);if(t.dataset.ord==='send'){await store.patch('orders',o.id,{status:'enviada',sentAt:nowIso()});toast('Orden marcada como enviada')}if(t.dataset.ord==='recv')await receiveOrder(o);if(t.dataset.ord==='del')await store.del('orders',o.id)}
  }catch(err){toast('No se pudo guardar el cambio')}
});

function dialog(html,onSubmit,wide){
  const d=$('dlg');d.innerHTML=`<form class="dlg__p${wide?' wide':''}" id="dform" novalidate>${html}</form>`;d.hidden=false;
  d.onclick=e=>{if(e.target===d||e.target.closest('[data-close]')){d.hidden=true;return}
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.x==='manual'){d.hidden=true;openManual(b.dataset.cid);return}
    if(b.dataset.x==='sellpkg'){d.hidden=true;openSellPkg(b.dataset.cid);return}
    if(b.dataset.x==='sellmemb'){d.hidden=true;openSellMemb(b.dataset.cid);return}
    if(b.dataset.x==='sell'){d.hidden=true;openSell(b.dataset.cid);return}
    if(b.dataset.act){d.hidden=true;doAct(b.dataset.act,b.dataset.id);return}
    if(b.dataset.client&&b.dataset.client!==''){d.hidden=true;openClient(b.dataset.client);return}
    if(b.dataset.viewcons){viewConsent(b.dataset.viewcons);return}
    if(b.dataset.signnow){d.hidden=true;openConsent(byId('bookings',b.dataset.signnow));return}
    if(b.dataset.delpost){store.del('content',b.dataset.delpost);d.hidden=true;toast('Publicación borrada');return}
    if(b.dataset.exp){d.hidden=true;exportData(b.dataset.exp);return}
    if(b.dataset.sigclear){const c=$(b.dataset.sigclear);c&&c.getContext('2d').clearRect(0,0,c.width,c.height);c._pad&&c._pad.clear();return}};
  $('dform').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;if(btn)btn.disabled=true;try{const ok=await onSubmit();if(ok!==false)d.hidden=true}catch(err){toast('No se pudo guardar')}finally{if(btn)btn.disabled=false}};
  const f=d.querySelector('input:not([type=checkbox]):not([type=file]),select');f&&f.focus({preventScroll:true});
}
const timeOptions=sel=>{let o='';for(let t=OPEN;t<=CLOSE;t+=STEP)o+=`<option value="${toHM(t)}" ${toHM(t)===sel?'selected':''}>${hm12(t)}</option>`;return o};
function openManual(cid,opt={}){const c=cid?byId('clients',cid):null;const w=opt.wl;const st=SET();
  dialog(`<div class="dlg__h"><h2>Nueva cita</h2><button type="button" data-close aria-label="Cerrar">×</button></div>

    <div class="field"><label for="m-svc">Ritual</label><select class="inp" id="m-svc">${SERVICES.map(s=>`<option value="${s.id}" ${w?.serviceId===s.id?'selected':''}>${esc(svcLabel(s))} · ${s.dur} min</option>`).join('')}</select></div>
    <div class="row2"><div class="field"><label for="m-date">Día</label><input class="inp" id="m-date" type="date" value="${opt.date||w?.date||(OS.day>=today()?OS.day:today())}"></div><div class="field"><label for="m-time">Hora</label><select class="inp" id="m-time">${timeOptions(opt.time||'10:00')}</select></div></div>
    <div class="row2"><div class="field"><label for="m-name">Nombre</label><input class="inp" id="m-name" value="${esc(c?.name||w?.name||'')}" list="m-cl"><datalist id="m-cl">${D.clients.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist></div>
    <div class="field"><label for="m-phone">Teléfono</label><input class="inp" id="m-phone" type="tel" value="${esc(c?.phone||w?.phone||'')}"></div></div>
    <div class="row2"><div class="field"><label for="m-src">Llegó por</label><select class="inp" id="m-src">${['WhatsApp','Instagram','Teléfono','Pana (llamada)','En persona','Lista de espera'].map(o=>`<option ${w&&o==='Lista de espera'?'selected':''}>${o}</option>`).join('')}</select></div>
    <div class="field"><label for="m-staff">Con</label><select class="inp" id="m-staff">${st.staff.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div></div>
    <p id="m-warn"></p><p class="err" id="m-err" hidden></p><button class="btn btn--pri btn--block" type="submit">Guardar cita</button>`,
    async()=>{const s=SVC[$('m-svc').value],date=$('m-date').value,start=$('m-time').value,name=$('m-name').value.trim(),err=$('m-err');
      const fail=m=>{err.textContent=m;err.hidden=false;return false};
      if(!date||!name)return fail('Falta el día o el nombre.');if(parseYmd(date).getDay()===0)return fail('Los domingos el parlour está cerrado.');
      const t=toMin(start);if(t+s.dur>CLOSE)return fail('Ese ritual no cabe antes del cierre (6pm).');
      if(busyOn(date).some(([a,b])=>t<b&&t+s.dur>a))return fail('Ese horario choca con otra cita o un bloqueo.');
      const ex=D.clients.find(x=>x.name.toLowerCase()===name.toLowerCase())||findClient($('m-phone').value);
      if(ex){const cf=contraFor(s.id,ex.flags);if(cf.block.length)return fail(`Contraindicación: ${ex.name} marcó “${cf.block[0].f}”. ${cf.block[0].why}.`)}
      const id=ex?ex.id:await upsertClient({name,phone:$('m-phone').value.trim(),source:$('m-src').value==='Lista de espera'?'web':$('m-src').value});const cl=byId('clients',id)||{name,phone:$('m-phone').value.trim()};

      await store.put('bookings',bid,doc);await scheduleReminders({...doc,id:bid});

  const chk=()=>{const s=SVC[$('m-svc').value];const ex=D.clients.find(x=>x.name.toLowerCase()===$('m-name').value.trim().toLowerCase());const cf=ex?contraFor(s.id,ex.flags):{block:[],warn:[]};
    $('m-warn').innerHTML=cf.block.length?`<span class="badbox" style="display:block">No permitido: ${esc(cf.block.map(x=>x.f).join(', '))}</span>`:cf.warn.length?`<span class="warnbox" style="display:block">Revisar: ${esc(cf.warn.map(x=>x.f).join(', '))}</span>`:needsConsent(s.id)?'<span class="mini">Este tratamiento requiere consentimiento firmado.</span>':'';
    const sl=slotsFor($('m-date').value,s.dur);if(!opt.time&&sl.length&&!sl.includes(toMin($('m-time').value)))$('m-time').value=toHM(sl[0])};

    <div class="row2"><div class="field"><label for="k-s">Desde</label><select class="inp" id="k-s">${timeOptions('13:00')}</select></div><div class="field"><label for="k-e">Hasta</label><select class="inp" id="k-e">${timeOptions('14:00')}</select></div></div>

function openRestock(p){
  dialog(`<div class="dlg__h"><h2>Registrar compra</h2><button type="button" data-close aria-label="Cerrar">×</button></div><p class="muted">${esc(p.name)} · hay ${p.stock} ${esc(p.unit)}</p>
    <div class="row2"><div class="field"><label for="r-q">Cantidad (${esc(p.unit)})</label><input class="inp" id="r-q" type="number" min="1" value="${Math.max(Math.ceil(p.min*2.5-p.stock),1)}"></div><div class="field"><label for="r-c">Total pagado</label><input class="inp" id="r-c" type="number" min="0" step="0.01"></div></div>
    <p class="small muted">El gasto se registra en Finanzas como “Productos”.</p><button class="btn btn--pri btn--block" type="submit">Guardar compra</button>`,
    async()=>{const q=+$('r-q').value||0;if(q<=0){toast('Pon la cantidad.');return false}const c=+$('r-c').value||r2(q*(p.cost||0));
      await store.patch('products',p.id,{stock:(p.stock||0)+q,moves:[...(p.moves||[]).slice(-14),{t:nowIso(),q,why:'Compra'}]});
      await store.put('expenses','e-'+uid(),{date:today(),category:'Productos',desc:`${p.name} · ${q} ${p.unit}`,amount:c});toast('Compra registrada · gasto en Finanzas')});
  const u=()=>$('r-c').value=r2((+$('r-q').value||0)*(p.cost||0));u();$('r-q').oninput=u;
}
function openMoves(p){
  dialog(`<div class="dlg__h"><h2>${esc(p.name)}</h2><button type="button" data-close aria-label="Cerrar">×</button></div>
    ${(p.moves||[]).length?`<div class="timeline">${[...p.moves].reverse().map(m=>{const d=new Date(m.t);return `<div><time>${shortD(ymd(d))}</time><b class="num" style="color:${m.q<0?'var(--bad)':'var(--ok)'}">${m.q>0?'+':''}${m.q} ${esc(p.unit)}</b> · ${esc(m.why)}</div>`}).join('')}</div>`:'<p class="muted small">Sin movimientos.</p>'}
    <p class="small muted">${p.retail?'Producto de venta.':'Se usa en: '+esc(SERVICES.filter(s=>useFor(s.id).some(([x])=>x===p.id)).map(s=>svcLabel(s)).join(', ')||'—')}</p>`,async()=>{});
}

function openStaff(){dialog(`<div class="dlg__h"><h2>Persona del equipo</h2><button type="button" data-close aria-label="Cerrar">×</button></div>
  <div class="row3"><div class="field"><label for="sf-n">Nombre</label><input class="inp" id="sf-n"></div><div class="field"><label for="sf-r">Rol</label><select class="inp" id="sf-r"><option>Esteticista</option><option>Masajista</option><option>Recepción</option></select></div><div class="field"><label for="sf-c">Comisión %</label><input class="inp" id="sf-c" type="number" min="0" max="100" value="40"></div></div>

function openTpl(){dialog(`<div class="dlg__h"><h2>Respuesta guardada</h2><button type="button" data-close aria-label="Cerrar">×</button></div>
  <div class="field"><label for="tp-t">Nombre</label><input class="inp" id="tp-t" placeholder="Ej. Estacionamiento"></div><div class="field"><label for="tp-m">Texto</label><textarea class="inp" id="tp-m" rows="4"></textarea></div>
