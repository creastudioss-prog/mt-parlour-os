<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reservar · mt aesthetics · New York</title>
<meta name="description" content="Reserva tu cita con María Teresa en MT Aesthetics · The Parlour, New York. Una clienta a la vez.">
<meta name="theme-color" content="#F4EFE6">
<link rel="icon" href="/pub/app-icon-192.png">
<link rel="apple-touch-icon" href="/pub/app-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=synonym@400,500,600&display=swap" rel="stylesheet">
<style>
:root{--cream:#F4EFE6;--oat:#EFE4D2;--paper:#FAF7F1;--euc:#1F2D24;--euc2:#15211A;--rosa:#D4A5A0;--carbon:#1A1A1A;--gris:#5A6359;--line:rgba(31,45,36,.14);--serif:'Fraunces','Times New Roman',serif;--sans:'Synonym',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--cream);color:var(--euc);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.top{padding:22px 20px 0;text-align:center}
.top img{height:22px;width:auto;display:inline-block}
.embed .top{display:none}
main{max-width:600px;margin:0 auto;padding:30px 20px 130px}
.embed main{padding-top:22px}
.steps{display:flex;gap:18px;justify-content:center;margin:0 0 26px;font-size:12px;letter-spacing:.06em;color:rgba(31,45,36,.42)}
.steps span[aria-current]{color:var(--euc)}
.steps span[aria-current]::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--euc);margin-right:7px;vertical-align:2px}
.steps .dot{display:none}
h1{font-family:var(--serif);font-weight:300;font-variation-settings:"SOFT" 100,"WONK" 0;font-size:clamp(30px,6vw,40px);line-height:1.08;letter-spacing:-.01em;margin:0 0 8px;text-align:center}
h1 em{font-style:italic}
.lede{text-align:center;margin:0 0 26px;color:var(--gris);font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -20px 18px;padding:2px 20px 8px;scrollbar-width:none}
@media (hover:hover) and (pointer:fine){.tabs{flex-wrap:wrap;justify-content:center;overflow:visible;margin:0 0 18px;padding:2px 0 8px}}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:transparent;border-radius:2px;padding:9px 15px;font-size:14px;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab[aria-pressed=true]{background:var(--euc);color:var(--cream);border-color:var(--euc)}
.list{display:grid;border-top:1px solid var(--line)}
.svc{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:18px 4px;cursor:pointer;transition:background .2s}
.svc:hover{background:rgba(31,45,36,.03)}
.svc[aria-pressed=true]{background:var(--paper)}
.svc b{display:block;font-family:var(--serif);font-weight:300;font-variation-settings:"SOFT" 100;font-size:21px;line-height:1.2}
.svc small{color:var(--gris);font-size:13px}
.svc .pr{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--gris);white-space:nowrap}
.svc .pr::after{content:"";width:16px;height:16px;border-radius:50%;border:1px solid var(--line);flex:none}
.svc[aria-pressed=true] .pr::after{border:5px solid var(--euc)}
.days{display:flex;gap:6px;overflow-x:auto;margin:0 -20px 18px;padding:2px 20px 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;border:1px solid var(--line);background:transparent;border-radius:2px;padding:10px 0;text-align:center;cursor:pointer}
.day span{display:block;font-size:11px;letter-spacing:.08em;color:var(--gris)}
.day b{display:block;font-family:var(--serif);font-size:23px;font-weight:300;line-height:1.15}
.day i{display:block;font-style:normal;font-size:10px;color:var(--gris);min-height:14px}
.day[disabled]{opacity:.3;cursor:default}
.day[aria-pressed=true]{background:var(--euc);color:var(--cream);border-color:var(--euc)}.day[aria-pressed=true] span,.day[aria-pressed=true] i{color:rgba(244,239,230,.8)}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.time{border:1px solid var(--line);background:transparent;border-radius:2px;padding:12px 0;cursor:pointer;font-size:15px}
.time[aria-pressed=true]{background:var(--euc);color:var(--cream);border-color:var(--euc)}
.lbl{display:block;font-size:12px;letter-spacing:.06em;color:var(--gris);margin:24px 0 8px}
.inp{width:100%;border:0;border-bottom:1px solid rgba(31,45,36,.3);background:transparent;border-radius:0;padding:10px 2px;font-size:17px}
.inp:focus{outline:none;border-bottom-color:var(--euc)}
textarea.inp{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:520px){.row{grid-template-columns:1fr}}
.checks{display:grid;gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.chk input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--euc);flex:none}
.hint{font-size:13px;color:var(--gris);margin:8px 0 0}
.sum{border:1px solid var(--line);padding:16px 18px;margin:0 0 8px;background:var(--paper)}
.sum b{font-family:var(--serif);font-weight:300;font-variation-settings:"SOFT" 100;font-size:21px}
.sum p{margin:2px 0 0;font-size:14px;color:var(--gris)}
.err{background:#F3E2DC;color:#7A2E1F;padding:12px 14px;margin:18px 0 0;font-size:14px}
.warn{background:var(--oat);padding:12px 14px;margin:18px 0 0;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,239,230,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.bar div{max-width:600px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:2px;padding:16px 20px;font-size:14px;letter-spacing:.04em;cursor:pointer;background:var(--euc);color:var(--cream);text-align:center;text-decoration:none;display:inline-block;transition:background .2s}
.btn:hover{background:var(--euc2)}
.btn[disabled]{opacity:.3;cursor:default}
.btn--ghost{flex:0 0 auto;background:transparent;color:var(--euc);border:1px solid var(--line)}
.btn--ghost:hover{background:rgba(31,45,36,.04)}
.done{text-align:center}
.done img{width:46px;margin:4px auto 18px;display:block}
.done .card{background:var(--paper);border:1px solid var(--line);padding:22px;margin:18px 0;text-align:left}
.done .card h2{font-family:var(--serif);font-weight:300;font-variation-settings:"SOFT" 100;font-size:23px;margin:0 0 6px}
.done .card p{margin:0 0 16px;font-size:15px;color:var(--gris)}
.done .stack{display:grid;gap:8px}
.wa{color:var(--euc)}
.foot{text-align:center;font-size:13px;color:var(--gris);margin-top:34px}
.foot a{color:var(--euc);text-underline-offset:3px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.empty{text-align:center;color:var(--gris);padding:18px 0}
.cal{background:var(--paper);border:1px solid var(--line);padding:18px 18px 14px;margin:20px 0 6px}
.cal__h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal__h b{font-family:var(--serif);font-weight:300;font-variation-settings:"SOFT" 100;font-size:21px}
.cal__nav{width:34px;height:34px;border:0;background:none;font-size:20px;color:var(--euc);cursor:pointer;border-radius:50%}
.cal__nav:hover{background:rgba(31,45,36,.06)}.cal__nav[disabled]{opacity:.25;cursor:default}
.cal__w,.cal__g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal__w span{font-size:12px;color:var(--gris);padding-bottom:8px}
.cal__g{row-gap:4px}
.cd{position:relative;justify-self:center;width:40px;height:40px;border:0;border-radius:50%;background:none;font-size:15px;color:var(--euc);cursor:pointer;transition:background .2s,color .2s}
.cd:hover:not([disabled]){background:rgba(31,45,36,.07)}
.cd[disabled]{color:rgba(31,45,36,.22);cursor:default}
.cd--today::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.cd[aria-pressed=true],.cd[aria-pressed=true]:hover{background:var(--euc)!important;color:var(--cream)!important}
.times{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))!important}
.time{border-radius:999px!important;background:var(--paper)!important}
.time[aria-pressed=true]{background:var(--euc)!important}
[hidden]{display:none!important}
</style>
<style id="grano">body::after{content:"";position:fixed;left:0;right:0;top:-25vh;height:calc(100vh + 50vh);height:calc(100lvh + 50vh);z-index:9999;pointer-events:none;background:url(/pub/grano.png) repeat;background-size:180px;opacity:.06;transform:translateZ(0)}</style>
</head>
<body>
<header class="top"><img src="/pub/nombre-verde.svg" alt="mt aesthetics"></header>
<main id="app" aria-live="polite"></main>
<nav class="bar" id="bar" hidden><div id="barin"></div></nav>
<script>
const $=s=>document.querySelector(s);
const Q=new URLSearchParams(location.search);if(Q.get('embed')==='1')document.documentElement.classList.add('embed');
const NAME=c=>c.replace('Wax','Cera');
const CATQ={faciales:'Faciales',masajes:'Masajes',cera:'Wax · Mujeres',hifu:'HIFU'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW=['dom','lun','mar','mié','jue','vie','sáb'],MONL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const monKey=m=>m[0]*12+m[1];
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const longDate=s=>{const d=pd(s);return ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][d.getDay()]+' '+d.getDate()+' de '+MONL[d.getMonth()]};
const h12=hm=>{let[h,m]=hm.split(':').map(Number);return ((h+11)%12+1)+':'+String(m).padStart(2,'0')+(h>=12?' pm':' am')};
const S={step:1,cat:null,svc:null,date:null,time:null,days:{},slots:[],f:{name:'',phone:'',email:'',note:'',flags:[],agree:false},err:'',busy:false,res:null};
let CAT=null;
const api=async(u,o)=>{const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'No se pudo completar. Intenta de nuevo.');return j};

async function init(){
  try{CAT=await api('/api/public/catalog')}catch(e){$('#app').innerHTML='<p class="empty">No pudimos cargar los servicios. Escríbenos por <a class="wa" href="https://wa.me/13474795229">WhatsApp</a>.</p>';return}
  if(CAT.open===false){$('#app').innerHTML='<h1>Volvemos pronto.</h1><p class="lede">Las reservas en línea están en pausa por ahora. Escríbele a María y te agenda.</p><p style="text-align:center"><a class="btn" style="display:inline-block;max-width:320px" href="https://wa.me/13474795229" target="_top">Escribir por WhatsApp</a></p>';return}
  S.cat=CAT.cats[0];
  const q=Q.get('servicio');if(q&&CAT.services.find(s=>s.id===q)){S.svc=CAT.services.find(s=>s.id===q);S.cat=S.svc.cat}else if(q&&CATQ[q]&&CAT.cats.includes(CATQ[q])){S.cat=CATQ[q]}
  render();
}
function bar(html){const b=$('#bar');if(!html){b.hidden=true;return}b.hidden=false;$('#barin').innerHTML=html}
function steps(){const n=['Servicio','Día y hora','Tus datos'];return `<div class="steps">${n.map((x,i)=>`<span ${S.step===i+1?'aria-current="step"':''}>${x}</span>`).join('')}</div>`}
function render(){
  const a=$('#app');
  if(S.step===1){
    const cats=[...CAT.cats,'Consulta'];
    const list=CAT.services.filter(s=>s.cat===S.cat);
    a.innerHTML=steps()+`<h1>¿Qué te gustaría?</h1><p class="lede">Una clienta a la vez. Todo se confirma en tu consulta de piel.</p>
    <div class="tabs" role="group" aria-label="Categorías">${cats.map(c=>`<button class="tab" data-cat="${esc(c)}" aria-pressed="${c===S.cat}">${esc(c==='Consulta'?'Consulta de piel':NAME(c))}</button>`).join('')}</div>
    <div class="list">${list.map(s=>`<button class="svc" data-svc="${s.id}" aria-pressed="${S.svc&&S.svc.id===s.id}"><span><b>${esc(s.name)}</b><small>${s.dur} min</small></span><span class="pr">${s.priceFrom?'desde $'+s.priceFrom:'sin costo'}</span></button>`).join('')}</div>
    <p class="foot">¿Primera vez o tienes dudas? Escríbele a María por <a href="https://wa.me/13474795229?text=${encodeURIComponent('Hola María Teresa, quiero información para reservar.')}">WhatsApp</a>.</p>`;
    bar(`<button class="btn" id="next" ${S.svc?'':'disabled'}>${S.svc?'Continuar · '+esc(S.svc.name):'Elige un servicio'}</button>`);
  }
  if(S.step===2){
    const t0=pd(CAT.today);const ds=[];for(let i=0;i<=CAT.policy.daysAhead;i++){const d=new Date(t0);d.setDate(t0.getDate()+i);ds.push(d)}
    const MIN=[t0.getFullYear(),t0.getMonth()],MX=new Date(t0);MX.setDate(t0.getDate()+CAT.policy.daysAhead);const MAX=[MX.getFullYear(),MX.getMonth()];if(!S.mon){const sd=S.date?pd(S.date):(()=>{const k=Object.keys(S.days).sort()[0];return k?pd(k):t0})();S.mon=[sd.getFullYear(),sd.getMonth()]}
    const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    a.innerHTML=steps()+`<div class="sum"><b>${esc(S.svc.name)}</b><p>${S.svc.dur} min · ${S.svc.priceFrom?'desde $'+S.svc.priceFrom:'sin costo'}</p></div>
    <div class="cal"><div class="cal__h"><b>${MONL[S.mon[1]][0].toUpperCase()+MONL[S.mon[1]].slice(1)} ${S.mon[0]}</b><span><button class="cal__nav" data-mon="-1" aria-label="Mes anterior" ${monKey(S.mon)<=monKey(MIN)?'disabled':''}>‹</button><button class="cal__nav" data-mon="1" aria-label="Mes siguiente" ${monKey(S.mon)>=monKey(MAX)?'disabled':''}>›</button></span></div>
    <div class="cal__w">${['lu','ma','mi','ju','vi','sá','do'].map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="cal__g">${(()=>{const f=new Date(S.mon[0],S.mon[1],1),off=(f.getDay()+6)%7,n=new Date(S.mon[0],S.mon[1]+1,0).getDate();let h='';for(let j=0;j<off;j++)h+='<span></span>';for(let d=1;d<=n;d++){const k=ymd(new Date(S.mon[0],S.mon[1],d)),ok=S.days[k];h+=`<button class="cd${k===CAT.today?' cd--today':''}" data-day="${k}" ${ok?'':'disabled'} aria-pressed="${S.date===k}" aria-label="${longDate(k)}${ok?'':', sin horario'}">${d}</button>`}return h})()}</div></div>
    <span class="lbl">Hora${S.date?' · '+longDate(S.date):''}</span>
    <div id="times">${!S.date?'<p class="hint">Escoge un día para ver los horarios.</p>':S.slots.length?`<div class="times">${S.slots.map(t=>`<button class="time" data-time="${t}" aria-pressed="${S.time===t}">${h12(t)}</button>`).join('')}</div>`:'<p class="hint">No quedan horarios ese día.</p>'}</div>`;
    bar(`<button class="btn btn--ghost" id="back">Atrás</button><button class="btn" id="next" ${S.time?'':'disabled'}>Continuar</button>`);
  }
  if(S.step===3){
    const f=S.f;
    a.innerHTML=steps()+`<div class="sum"><b>${esc(S.svc.name)}</b><p>${longDate(S.date)} · ${h12(S.time)} · ${S.svc.dur} min</p></div>
    <form id="form" novalidate autocomplete="on">
      <label class="lbl" for="f-name">Nombre y apellido</label><input class="inp" id="f-name" name="name" autocomplete="name" value="${esc(f.name)}" required>
      <div class="row"><div><label class="lbl" for="f-phone">Teléfono</label><input class="inp" id="f-phone" name="tel" type="tel" inputmode="tel" autocomplete="tel" value="${esc(f.phone)}" required></div>
      <div><label class="lbl" for="f-email">Correo (opcional)</label><input class="inp" id="f-email" name="email" type="email" autocomplete="email" value="${esc(f.email)}"></div></div>
      <span class="lbl">Tu salud · marca lo que aplique</span>
      <div class="checks">${CAT.health.map((h,i)=>`<label class="chk"><input type="checkbox" class="fl" value="${esc(h)}" ${f.flags.includes(h)?'checked':''}> ${esc(h)}</label>`).join('')}</div>
      <p class="hint">Esto nos ayuda a cuidarte. Solo lo ve María Teresa.</p>
      <label class="lbl" for="f-note">¿Algo que María deba saber? (opcional)</label><textarea class="inp" id="f-note">${esc(f.note)}</textarea>
      <div class="hp" aria-hidden="true"><label>Sitio web <input id="f-web" tabindex="-1" autocomplete="off"></label></div>
      <span class="lbl">Política de citas</span>
      <label class="chk"><input type="checkbox" id="f-agree" ${f.agree?'checked':''}> Entiendo que puedo cambiar o cancelar mi cita hasta ${CAT.policy.refundHours} horas antes desde mi app${CAT.payments?`, y que el depósito de $${CAT.policy.deposit} se descuenta del total`:''}.</label>
      ${S.err?`<div class="err" role="alert">${esc(S.err)}</div>`:''}
    </form>`;
    bar(`<button class="btn btn--ghost" id="back">Atrás</button><button class="btn" id="send" ${S.busy?'disabled':''}>${S.busy?'Reservando…':'Reservar'}</button>`);
  }
  if(S.step===4){
    const r=S.res,abs=location.origin+r.portal;
    a.innerHTML=`<div class="done"><img src="/pub/silueta-verde.svg" alt=""><h1>Tu cita está <em>reservada.</em></h1>
    <div class="sum" style="text-align:left"><b>${esc(S.svc.name)}</b><p>${longDate(S.date)} · ${h12(S.time)} · ${S.svc.dur} min</p></div>
    ${r.warn&&r.warn.length?`<div class="warn">María lo revisará contigo antes de empezar: ${esc(r.warn[0])}.</div>`:''}
    <div class="card"><h2>Tu app del parlour</h2><p>Ahí ves tu cita, la cambias si lo necesitas${r.needsConsent?', firmas tu consentimiento antes de llegar':''} y recibes los cuidados para después. Guárdala en tu pantalla de inicio.</p>
    <div class="stack"><a class="btn" href="${esc(r.portal)}">Abrir mi app</a><button class="btn btn--ghost" id="copy" style="flex:auto">Copiar mi enlace</button></div></div>
    <div class="stack"><a class="btn btn--ghost" style="flex:auto" href="data:text/calendar;charset=utf-8,${encodeURIComponent(ics())}" download="cita-mt-aesthetics.ics">Agregar a mi calendario</a>
    <a class="btn btn--ghost" style="flex:auto" href="https://wa.me/13474795229?text=${encodeURIComponent('Hola María Teresa, acabo de reservar '+S.svc.name+' para el '+longDate(S.date)+' a las '+h12(S.time)+'.')}">Avisar a María por WhatsApp</a></div>
    <div class="sum" style="text-align:left;margin-top:12px"><b>Dónde</b><p>Phenix Salon Suites · Suite 107<br>171 W 230th St, Bronx, NY 10463</p><p><a href="https://maps.google.com/?q=171+W+230th+St+Suite+107+Bronx+NY+10463" target="_blank" rel="noopener" style="color:inherit">Cómo llegar</a> · tren 1, parada 231 St</p></div></div>`;
    bar('');
    if(Q.get('embed')==='1')a.querySelectorAll('a[href^="/c/"],a[href^="https://wa.me"]').forEach(x=>x.target='_top');
    $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(abs);$('#copy').textContent='Enlace copiado'}catch{prompt('Copia tu enlace:',abs)}};
  }
}
function ics(){const[y,m,d]=S.date.split('-');const[h,mi]=S.time.split(':');const st=new Date(+y,m-1,+d,+h,+mi),en=new Date(st.getTime()+S.svc.dur*6e4);
  const f=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MT Aesthetics//ES','BEGIN:VEVENT','UID:'+S.res.bookingId+'@mtaesthetics','DTSTART;TZID=America/New_York:'+f(st),'DTEND;TZID=America/New_York:'+f(en),'SUMMARY:'+S.svc.name+' · MT Aesthetics','DESCRIPTION:Tu app: '+location.origin+S.res.portal,'END:VEVENT','END:VCALENDAR'].join('\r\n')}
async function loadDays(){S.days={};try{S.days=(await api('/api/public/days?service='+S.svc.id)).days}catch(e){}}
async function loadSlots(){S.slots=[];try{S.slots=(await api('/api/public/slots?service='+S.svc.id+'&date='+S.date)).slots}catch(e){}}
function readForm(){const f=S.f;f.name=$('#f-name').value.trim();f.phone=$('#f-phone').value.trim();f.email=$('#f-email').value.trim();f.note=$('#f-note').value.trim();f.flags=[...document.querySelectorAll('.fl:checked')].map(i=>i.value);f.agree=$('#f-agree').checked}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.cat){S.cat=t.dataset.cat;render();return}
  if(t.dataset.svc){S.svc=CAT.services.find(s=>s.id===t.dataset.svc);S.date=null;S.time=null;S.mon=null;render();return}
  if(t.dataset.mon){const m=S.mon[0]*12+S.mon[1]+Number(t.dataset.mon);S.mon=[Math.floor(m/12),m%12];render();return}
  if(t.dataset.day){S.date=t.dataset.day;S.time=null;await loadSlots();render();return}
  if(t.dataset.time){S.time=t.dataset.time;render();return}
  if(t.id==='back'){if(S.step===3)readForm();S.err='';S.step--;render();scrollTo(0,0);return}
  if(t.id==='next'){if(S.step===1){await loadDays();S.step=2}else if(S.step===2){S.step=3}render();scrollTo(0,0);return}
  if(t.id==='send'){readForm();const f=S.f;S.err='';
    if(f.name.length<2)S.err='Escribe tu nombre y apellido.';else if(f.phone.replace(/\D/g,'').length<10)S.err='Escribe un teléfono de 10 dígitos.';else if(!f.agree)S.err='Marca la casilla de la política de citas.';
    if(S.err){render();return}
    S.busy=true;render();
    try{S.res=await api('/api/public/book',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({serviceId:S.svc.id,date:S.date,start:S.time,name:f.name,phone:f.phone,email:f.email,note:f.note,flags:f.flags,agree:f.agree,website:$('#f-web').value})});
      try{localStorage.setItem('mt-portal',S.res.portal)}catch(e){}
      if(S.res.payUrl){try{(Q.get('embed')==='1'?window.top:window).location.href=S.res.payUrl}catch(e){location.href=S.res.payUrl}return}
      S.step=4}
    catch(err){S.err=err.message;if(/ocupar|libre/.test(err.message)){await loadSlots()}}
    S.busy=false;render();scrollTo(0,0);return}
});
init();
</script>
</body>
</html>
