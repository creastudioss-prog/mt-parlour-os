<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reservar · MT Aesthetics · The Parlour</title>
<meta name="description" content="Reserva tu cita con María Teresa en MT Aesthetics · The Parlour, New York. Una clienta a la vez.">
<meta name="theme-color" content="#1F2D24">
<link rel="icon" href="/pub/app-icon-192.png">
<link rel="apple-touch-icon" href="/pub/app-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=synonym@400,500,600&display=swap" rel="stylesheet">
<style>
:root{--cream:#F4EFE6;--oat:#EFE4D2;--euc:#1F2D24;--euc2:#15211A;--copper:#A87C5C;--carbon:#1A1A1A;--line:rgba(26,26,26,.16);--serif:'Fraunces','Times New Roman',serif;--sans:'Synonym',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--cream);color:var(--carbon);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.top{background:var(--euc);color:var(--cream);text-align:center;padding:28px 20px 30px}
.top img{width:58px;height:auto;display:block;margin:0 auto 14px}
.wm{font-family:var(--serif);font-variation-settings:"opsz" 144,"SOFT" 0;line-height:.88;font-size:30px}
.wm b{display:block;font-weight:480;letter-spacing:-.025em}.wm span{display:block;font-weight:380;letter-spacing:.022em}
.end{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--copper);margin-top:12px}
main{max-width:640px;margin:0 auto;padding:28px 20px 120px}
.steps{display:flex;gap:6px;justify-content:center;margin:0 0 24px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(26,26,26,.45)}
.steps span[aria-current]{color:var(--euc);font-weight:600}
h1{font-family:var(--serif);font-weight:380;font-variation-settings:"opsz" 72;font-size:34px;line-height:1.08;margin:0 0 6px;text-align:center}
h1 em{color:var(--copper);font-style:italic}
.lede{text-align:center;margin:0 0 26px;color:rgba(26,26,26,.7)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -20px 14px;padding-left:20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer;white-space:nowrap}
.tab[aria-pressed=true]{background:var(--euc);color:var(--cream);border-color:var(--euc)}
.list{display:grid;gap:10px}
.svc{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;width:100%;background:#FBF8F3;border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer}
.svc:hover,.svc[aria-pressed=true]{border-color:var(--euc)}
.svc[aria-pressed=true]{box-shadow:inset 0 0 0 1px var(--euc)}
.svc b{display:block;font-family:var(--serif);font-weight:440;font-size:19px;font-variation-settings:"opsz" 24}
.svc small{color:rgba(26,26,26,.6);font-size:13px}
.svc .pr{font-size:13px;color:var(--copper);white-space:nowrap}
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 18px;padding:2px 20px 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:64px;border:1px solid var(--line);background:#FBF8F3;border-radius:14px;padding:10px 0;text-align:center;cursor:pointer}
.day span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(26,26,26,.55)}
.day b{display:block;font-family:var(--serif);font-size:24px;font-weight:420;line-height:1.1}
.day i{display:block;font-style:normal;font-size:10px;color:var(--copper);min-height:14px}
.day[disabled]{opacity:.35;cursor:default}
.day[aria-pressed=true]{background:var(--euc);color:var(--cream);border-color:var(--euc)}.day[aria-pressed=true] span,.day[aria-pressed=true] i{color:var(--cream)}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.time{border:1px solid var(--line);background:#FBF8F3;border-radius:10px;padding:11px 0;cursor:pointer;font-size:15px}
.time[aria-pressed=true]{background:var(--euc);color:var(--cream);border-color:var(--euc)}
.lbl{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(26,26,26,.6);margin:22px 0 8px}
.inp{width:100%;border:1px solid var(--line);background:#FBF8F3;border-radius:10px;padding:13px 14px;font-size:16px}
.inp:focus{outline:2px solid var(--euc);outline-offset:1px}
textarea.inp{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.row{grid-template-columns:1fr}}
.checks{display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--euc);flex:none}
.hint{font-size:13px;color:rgba(26,26,26,.6);margin:6px 0 0}
.sum{background:var(--oat);border-radius:14px;padding:16px 18px;margin:0 0 6px}
.sum b{font-family:var(--serif);font-weight:440;font-size:19px}
.sum p{margin:2px 0 0;font-size:14px;color:rgba(26,26,26,.72)}
.err{background:#F6E3DC;color:#7A2E1F;border-radius:10px;padding:12px 14px;margin:16px 0 0;font-size:14px}
.warn{background:#F3EBD8;border-radius:10px;padding:12px 14px;margin:16px 0 0;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,239,230,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.bar div{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:999px;padding:16px 20px;font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;background:var(--euc);color:var(--cream);text-align:center;text-decoration:none;display:inline-block}
.btn[disabled]{opacity:.35;cursor:default}
.btn--ghost{flex:0 0 auto;background:transparent;color:var(--euc);border:1px solid var(--line)}
.btn--copper{background:var(--copper)}
.done{text-align:center}
.done img{width:74px;margin:6px auto 18px;display:block}
.done .card{background:#FBF8F3;border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0;text-align:left}
.done .card h2{font-family:var(--serif);font-weight:420;font-size:22px;margin:0 0 6px}
.done .card p{margin:0 0 14px;font-size:15px;color:rgba(26,26,26,.75)}
.done .stack{display:grid;gap:10px}
.wa{color:var(--euc)}
.foot{text-align:center;font-size:13px;color:rgba(26,26,26,.6);margin-top:36px}
.foot a{color:var(--euc)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.empty{text-align:center;color:rgba(26,26,26,.6);padding:18px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <img src="/pub/mt-sello-cobre.svg" alt="">
  <div class="wm" aria-label="MT Aesthetics"><b>MT</b><span>AESTHETICS</span></div>
  <div class="end">The Parlour · New York</div>
</header>
<main id="app" aria-live="polite"></main>
<nav class="bar" id="bar" hidden><div id="barin"></div></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW=['dom','lun','mar','mié','jue','vie','sáb'],MONL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const longDate=s=>{const d=pd(s);return ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][d.getDay()]+' '+d.getDate()+' de '+MONL[d.getMonth()]};
const h12=hm=>{let[h,m]=hm.split(':').map(Number);return ((h+11)%12+1)+':'+String(m).padStart(2,'0')+(h>=12?' pm':' am')};
const S={step:1,cat:null,svc:null,date:null,time:null,days:{},slots:[],f:{name:'',phone:'',email:'',note:'',flags:[],agree:false},err:'',busy:false,res:null};
let CAT=null;
const api=async(u,o)=>{const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'No se pudo completar. Intenta de nuevo.');return j};

async function init(){
  try{CAT=await api('/api/public/catalog')}catch(e){$('#app').innerHTML='<p class="empty">No pudimos cargar los servicios. Escríbenos por <a class="wa" href="https://wa.me/13474795229">WhatsApp</a>.</p>';return}
  S.cat=CAT.cats[0];
  const q=new URLSearchParams(location.search).get('servicio');if(q&&CAT.services.find(s=>s.id===q)){S.svc=CAT.services.find(s=>s.id===q);S.cat=S.svc.cat}
  render();
}
function bar(html){const b=$('#bar');if(!html){b.hidden=true;return}b.hidden=false;$('#barin').innerHTML=html}
function steps(){const n=['Servicio','Día y hora','Tus datos'];return `<div class="steps">${n.map((x,i)=>`<span ${S.step===i+1?'aria-current="step"':''}>${i+1} ${x}</span>`).join('<span>·</span>')}</div>`}
function render(){
  const a=$('#app');
  if(S.step===1){
    const cats=[...CAT.cats,'Consulta'];
    const list=CAT.services.filter(s=>s.cat===S.cat);
    a.innerHTML=steps()+`<h1>Escoge tu <em>ritual</em></h1><p class="lede">Una clienta a la vez. Cada servicio se confirma en tu consulta de piel.</p>
    <div class="tabs" role="group" aria-label="Categorías">${cats.map(c=>`<button class="tab" data-cat="${esc(c)}" aria-pressed="${c===S.cat}">${esc(c==='Consulta'?'Consulta de piel':c)}</button>`).join('')}</div>
    <div class="list">${list.map(s=>`<button class="svc" data-svc="${s.id}" aria-pressed="${S.svc&&S.svc.id===s.id}"><span><b>${esc(s.name)}</b><small>${s.dur} min</small></span><span class="pr">${s.priceFrom?'desde $'+s.priceFrom:'sin costo'}</span></button>`).join('')}</div>
    <p class="foot">¿Primera vez o tienes dudas? Escríbele a María por <a href="https://wa.me/13474795229?text=${encodeURIComponent('Hola María Teresa, quiero información para reservar.')}">WhatsApp</a>.</p>`;
    bar(`<button class="btn" id="next" ${S.svc?'':'disabled'}>Continuar</button>`);
  }
  if(S.step===2){
    const t0=pd(CAT.today);const ds=[];for(let i=0;i<=CAT.policy.daysAhead;i++){const d=new Date(t0);d.setDate(t0.getDate()+i);ds.push(d)}
    const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    a.innerHTML=steps()+`<div class="sum"><b>${esc(S.svc.name)}</b><p>${S.svc.dur} min · ${S.svc.priceFrom?'desde $'+S.svc.priceFrom:'sin costo'}</p></div>
    <span class="lbl">Día</span><div class="days" id="days">${ds.map(d=>{const k=ymd(d),n=S.days[k];return `<button class="day" data-day="${k}" ${n?'':'disabled'} aria-pressed="${S.date===k}" aria-label="${longDate(k)}${n?'':', sin horario'}"><span>${DOW[d.getDay()]}</span><b>${d.getDate()}</b><i>${d.getDate()===1||ds[0]===d?MONL[d.getMonth()].slice(0,3):''}</i></button>`}).join('')}</div>
    <span class="lbl">Hora${S.date?' · '+longDate(S.date):''}</span>
    <div id="times">${!S.date?'<p class="hint">Escoge un día para ver los horarios.</p>':S.slots.length?`<div class="times">${S.slots.map(t=>`<button class="time" data-time="${t}" aria-pressed="${S.time===t}">${h12(t)}</button>`).join('')}</div>`:'<p class="hint">No quedan horarios ese día.</p>'}</div>`;
    const sel=a.querySelector('.day[aria-pressed=true]')||a.querySelector('.day:not([disabled])');sel&&sel.scrollIntoView({inline:'center',block:'nearest'});
    bar(`<button class="btn btn--ghost" id="back">Atrás</button><button class="btn" id="next" ${S.time?'':'disabled'}>Continuar</button>`);
  }
  if(S.step===3){
    const f=S.f;
    a.innerHTML=steps()+`<div class="sum"><b>${esc(S.svc.name)}</b><p>${longDate(S.date)} · ${h12(S.time)} · ${S.svc.dur} min</p></div>
    <form id="form" novalidate autocomplete="on">
      <label class="lbl" for="f-name">Nombre y apellido</label><input class="inp" id="f-name" name="name" autocomplete="name" value="${esc(f.name)}" required>
      <div class="row"><div><label class="lbl" for="f-phone">Teléfono</label><input class="inp" id="f-phone" name="tel" type="tel" inputmode="tel" autocomplete="tel" value="${esc(f.phone)}" required></div>
      <div><label class="lbl" for="f-email">Correo (opcional)</label><input class="inp" id="f-email" name="email" type="email" autocomplete="email" value="${esc(f.email)}"></div></div>
      <span class="lbl">Tu salud · marca lo que aplique</span>
      <div class="checks">${CAT.health.map((h,i)=>`<label class="chk"><input type="checkbox" class="fl" value="${esc(h)}" ${f.flags.includes(h)?'checked':''}> ${esc(h)}</label>`).join('')}</div>
      <p class="hint">Esto nos ayuda a cuidarte. Solo lo ve María Teresa.</p>
      <label class="lbl" for="f-note">¿Algo que María deba saber? (opcional)</label><textarea class="inp" id="f-note">${esc(f.note)}</textarea>
      <div class="hp" aria-hidden="true"><label>Sitio web <input id="f-web" tabindex="-1" autocomplete="off"></label></div>
      <span class="lbl">Política de citas</span>
      <label class="chk"><input type="checkbox" id="f-agree" ${f.agree?'checked':''}> Entiendo que puedo cambiar o cancelar mi cita hasta ${CAT.policy.refundHours} horas antes desde mi app${CAT.payments?`, y que el depósito de $${CAT.policy.deposit} se descuenta del total`:''}.</label>
      ${S.err?`<div class="err" role="alert">${esc(S.err)}</div>`:''}
    </form>`;
    bar(`<button class="btn btn--ghost" id="back">Atrás</button><button class="btn" id="send" ${S.busy?'disabled':''}>${S.busy?'Reservando…':'Reservar'}</button>`);
  }
  if(S.step===4){
    const r=S.res,abs=location.origin+r.portal;
    a.innerHTML=`<div class="done"><img src="/pub/mt-sello-cobre.svg" alt=""><h1>Tu cita está <em>reservada</em></h1>
    <div class="sum" style="text-align:left"><b>${esc(S.svc.name)}</b><p>${longDate(S.date)} · ${h12(S.time)} · ${S.svc.dur} min</p></div>
    ${r.warn&&r.warn.length?`<div class="warn">María lo revisará contigo antes de empezar: ${esc(r.warn[0])}.</div>`:''}
    <div class="card"><h2>Tu app del parlour</h2><p>Ahí ves tu cita, la cambias si lo necesitas${r.needsConsent?', firmas tu consentimiento antes de llegar':''} y recibes los cuidados para después. Guárdala en tu pantalla de inicio.</p>
    <div class="stack"><a class="btn" href="${esc(r.portal)}">Abrir mi app</a><button class="btn btn--ghost" id="copy" style="flex:auto">Copiar mi enlace</button></div></div>
    <div class="stack"><a class="btn btn--ghost" style="flex:auto" href="data:text/calendar;charset=utf-8,${encodeURIComponent(ics())}" download="cita-mt-aesthetics.ics">Agregar a mi calendario</a>
    <a class="btn btn--ghost" style="flex:auto" href="https://wa.me/13474795229?text=${encodeURIComponent('Hola María Teresa, acabo de reservar '+S.svc.name+' para el '+longDate(S.date)+' a las '+h12(S.time)+'.')}">Avisar a María por WhatsApp</a></div>
    <p class="foot">Te enviamos la dirección exacta al confirmar.</p></div>`;
    bar('');
    $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(abs);$('#copy').textContent='Enlace copiado'}catch{prompt('Copia tu enlace:',abs)}};
  }
}
function ics(){const[y,m,d]=S.date.split('-');const[h,mi]=S.time.split(':');const st=new Date(+y,m-1,+d,+h,+mi),en=new Date(st.getTime()+S.svc.dur*6e4);
  const f=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MT Aesthetics//ES','BEGIN:VEVENT','UID:'+S.res.bookingId+'@mtaesthetics','DTSTART;TZID=America/New_York:'+f(st),'DTEND;TZID=America/New_York:'+f(en),'SUMMARY:'+S.svc.name+' · MT Aesthetics','DESCRIPTION:Tu app: '+location.origin+S.res.portal,'END:VEVENT','END:VCALENDAR'].join('\r\n')}
async function loadDays(){S.days={};try{S.days=(await api('/api/public/days?service='+S.svc.id)).days}catch(e){}}
async function loadSlots(){S.slots=[];try{S.slots=(await api('/api/public/slots?service='+S.svc.id+'&date='+S.date)).slots}catch(e){}}
function readForm(){const f=S.f;f.name=$('#f-name').value.trim();f.phone=$('#f-phone').value.trim();f.email=$('#f-email').value.trim();f.note=$('#f-note').value.trim();f.flags=[...document.querySelectorAll('.fl:checked')].map(i=>i.value);f.agree=$('#f-agree').checked}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.cat){S.cat=t.dataset.cat;render();return}
  if(t.dataset.svc){S.svc=CAT.services.find(s=>s.id===t.dataset.svc);S.date=null;S.time=null;render();return}
  if(t.dataset.day){S.date=t.dataset.day;S.time=null;await loadSlots();render();return}
  if(t.dataset.time){S.time=t.dataset.time;render();return}
  if(t.id==='back'){if(S.step===3)readForm();S.err='';S.step--;render();scrollTo(0,0);return}
  if(t.id==='next'){if(S.step===1){await loadDays();S.step=2}else if(S.step===2){S.step=3}render();scrollTo(0,0);return}
  if(t.id==='send'){readForm();const f=S.f;S.err='';
    if(f.name.length<2)S.err='Escribe tu nombre y apellido.';else if(f.phone.replace(/\D/g,'').length<10)S.err='Escribe un teléfono de 10 dígitos.';else if(!f.agree)S.err='Marca la casilla de la política de citas.';
    if(S.err){render();return}
    S.busy=true;render();
    try{S.res=await api('/api/public/book',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({serviceId:S.svc.id,date:S.date,start:S.time,name:f.name,phone:f.phone,email:f.email,note:f.note,flags:f.flags,agree:f.agree,website:$('#f-web').value})});
      try{localStorage.setItem('mt-portal',S.res.portal)}catch(e){}
      if(S.res.payUrl){location.href=S.res.payUrl;return}
      S.step=4}
    catch(err){S.err=err.message;if(/ocupar|libre/.test(err.message)){await loadSlots()}}
    S.busy=false;render();scrollTo(0,0);return}
});
init();
</script>
</body>
</html>
